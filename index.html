          const t = setTimeout(() => loadCustomers(custPage, search), 400);
          return () => clearTimeout(t);
        }, [activeTable, custPage, search]);

        useEffect(() => {
          if (activeTable !== 'meters') return;
          const t = setTimeout(() => loadMeters(meterPage, search), 400);
          return () => clearTimeout(t);
        }, [activeTable, meterPage, search]);

        useEffect(() => {
          if (activeTable === 'roles') {
            setLoadingRoles(true);
            if (typeof google !== 'undefined' && google.script) {
              google.script.run.withSuccessHandler(data => { setRolesData(Array.isArray(data) ? data : []); setLoadingRoles(false); }).withFailureHandler(() => { setLoadingRoles(false); }).adminListRoles();
            } else { setLoadingRoles(false); }
          }
        }, [activeTable]);

        const filteredRoles = useMemo(() => {
          const term = search.toLowerCase();
          return rolesData.filter(r => String(r.code || '').toLowerCase().includes(term) || String(r.label || '').toLowerCase().includes(term));
        }, [rolesData, search]);

        const reloadRoles = () => {
          setLoadingRoles(true);
          if (typeof google !== 'undefined' && google.script) {
            google.script.run.withSuccessHandler(data => { setRolesData(Array.isArray(data) ? data : []); setLoadingRoles(false); }).withFailureHandler(() => { setLoadingRoles(false); }).adminListRoles();
          } else { setLoadingRoles(false); }
        };

        const reloadJobs = () => {
          setLoadingJobs(true);
          if (typeof google !== 'undefined' && google.script) {
            google.script.run.withSuccessHandler(data => { setJobsData(Array.isArray(data) ? data : []); setLoadingJobs(false); }).withFailureHandler(() => { setLoadingJobs(false); }).getAdminJobs();
          } else { setLoadingJobs(false); }
        };

        // 📊 Export ใบงานเป็น Excel (20 คอลัมน์)
        // 🚀 รายการที่โหลดไว้เป็นแบบเบา (ไม่มีหมายเหตุ/รูปครบ) — ตอน Export/Sync จึงดึงข้อมูลเต็มมาก่อน
        const fetchFullJobs = () => new Promise((resolve, reject) => {
          if (typeof google === 'undefined' || !google.script) return resolve([]);
          google.script.run
            .withSuccessHandler(data => resolve(Array.isArray(data) ? data : []))
            .withFailureHandler(err => reject(err))
            .getAdminJobsFull();
        });
        const applySearch = (list) => {
          const term = search.toLowerCase();
          if (!term) return list;
          return list.filter(j => String(j.jobNo || '').toLowerCase().includes(term) || String(j.meterId || '').toLowerCase().includes(term) || String(j.userName || '').toLowerCase().includes(term) || String(j.ca || j.caNo || '').toLowerCase().includes(term));
        };

        const exportJobsExcel = async () => {
          if (typeof XLSX === 'undefined') { alert('ไลบรารี Excel ยังโหลดไม่เสร็จ ลองใหม่อีกครั้งครับ'); return; }
          showToast('กำลังเตรียมข้อมูลสำหรับ Export...');
          let fullList = [];
          try { fullList = await fetchFullJobs(); } catch (e) { alert('ดึงข้อมูลไม่สำเร็จ: ' + e); return; }
          const rows = applySearch(fullList).sort((a, b) => Number(a.jobNo) - Number(b.jobNo));
          if (!rows || rows.length === 0) { alert('ไม่มีข้อมูลใบงานให้ส่งออก'); return; }

          const imgCell = (val) => {
            const arr = (typeof val === 'string' ? val.split('|||') : (Array.isArray(val) ? val : [])).filter(Boolean);
            if (arr.length === 0) return '';
            return arr[0].startsWith('http') ? arr.join('\n') : `มีรูป (${arr.length})`;
          };

          const headers = ['เลขที่ใบงาน','วันที่แจ้ง','สถานะ','PEA มิเตอร์','CA (ผู้ใช้ไฟฟ้า)','ชื่อ-นามสกุล','ที่อยู่-สถานที่ใช้ไฟฟ้า','คำอธิบายหมวดอุปกรณ์','หน่วยการอ่านมิเตอร์','เลขลำดับจดหน่วย','หมวดอัตรา','ชื่อผู้แจ้ง','สาเหตุชำรุด','เหตุผลชำรุด','สถานะแจ้ง Line','พิกัด','หมายเหตุ','ระยะเวลา','ลิงค์รูปแจ้งงาน','ลิงค์รูปปิดงาน'];

          const body = rows.map(j => [
            j.jobNo || '',
            formatDate(j.timestamp),
            getSafeStatus(j.status),
            j.meterId || '',
            j.ca || j.caNo || '',
            j.userName || '',
            j.userAddress || '',
            j.meterSize || '',
            j.mru || '',
            j.sequenceNo || '',
            j.rateCategory || '',
            j.reporterName || '',
            j.cause || '',
            j.defectReason || '',
            '-',
            (j.lat && j.lng) ? `${j.lat}, ${j.lng}` : '',
            j.note || '',
            j.duration || '',
            imgCell(j.image),
            imgCell(j.auditLink)
          ]);

          const aoa = [headers, ...body];
          const ws = XLSX.utils.aoa_to_sheet(aoa);

          // ความกว้างคอลัมน์
          ws['!cols'] = [
            {wch:12},{wch:18},{wch:16},{wch:13},{wch:15},{wch:22},{wch:32},{wch:30},{wch:14},{wch:12},
            {wch:10},{wch:16},{wch:16},{wch:12},{wch:13},{wch:20},{wch:24},{wch:14},{wch:26},{wch:26}
          ];
          ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s:{r:0,c:0}, e:{r:0,c:headers.length-1} }) };

          const range = XLSX.utils.decode_range(ws['!ref']);
          for (let R = range.s.r; R <= range.e.r; R++) {
            for (let C = range.s.c; C <= range.e.c; C++) {
              const ref = XLSX.utils.encode_cell({ r:R, c:C });
              if (!ws[ref]) continue;
              if (R === 0) {
                ws[ref].s = {
                  fill: { fgColor: { rgb: '5F259F' } },
                  font: { color: { rgb: 'FFFFFF' }, bold: true, sz: 11 },
                  alignment: { horizontal: 'center', vertical: 'center', wrapText: false },
                  border: { top:{style:'thin',color:{rgb:'4A1D7C'}}, bottom:{style:'thin',color:{rgb:'4A1D7C'}}, left:{style:'thin',color:{rgb:'4A1D7C'}}, right:{style:'thin',color:{rgb:'4A1D7C'}} }
                };
              } else {
                ws[ref].s = {
                  alignment: { vertical: 'top', wrapText: false },
                  border: { top:{style:'thin',color:{rgb:'E5E7EB'}}, bottom:{style:'thin',color:{rgb:'E5E7EB'}}, left:{style:'thin',color:{rgb:'E5E7EB'}}, right:{style:'thin',color:{rgb:'E5E7EB'}} }
                };
              }
            }
          }

          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'ใบงานแจ้งซ่อม');
          const d = new Date();
          const pad = n => String(n).padStart(2,'0');
          const fname = `PEA_MTS_ใบงาน_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.xlsx`;
          XLSX.writeFile(wb, fname);
          showToast(`ส่งออก Excel เรียบร้อย (${rows.length.toLocaleString()} รายการ)`);
        };

        // 🔄 Sync ใบงานลง Google Sheet (เพิ่มแถวใหม่ / อัปเดตแถวเดิม)
        const [syncing, setSyncing] = useState(false);
        const syncJobsToSheet = async () => {
          showToast('กำลังเตรียมข้อมูลสำหรับ Sync...');
          let fullList = [];
          try { fullList = await fetchFullJobs(); } catch (e) { alert('ดึงข้อมูลไม่สำเร็จ: ' + e); return; }
          const src = applySearch(fullList).sort((a, b) => Number(a.jobNo) - Number(b.jobNo));
          if (!src || src.length === 0) { alert('ไม่มีข้อมูลใบงานให้ Sync'); return; }

          const imgCell = (val) => {
            const arr = (typeof val === 'string' ? val.split('|||') : (Array.isArray(val) ? val : [])).filter(Boolean);
            if (arr.length === 0) return '';
            return arr[0].startsWith('http') ? arr.join('\n') : `มีรูป (${arr.length})`;
          };

          const rows = src.map(j => [
            j.jobNo || '', formatDate(j.timestamp), getSafeStatus(j.status), j.meterId || '',
            j.ca || j.caNo || '', j.userName || '', j.userAddress || '', j.meterSize || '',
            j.mru || '', j.sequenceNo || '', j.rateCategory || '', j.reporterName || '',
            j.cause || '', j.defectReason || '', '-', (j.lat && j.lng) ? `${j.lat}, ${j.lng}` : '',
            j.note || '', j.duration || '', imgCell(j.image), imgCell(j.auditLink)
          ]);

          // 🚀 ลด Egress: ยืนยันก่อน + กันกดซ้ำภายใน 60 วินาที
          const lastSync = Number(sessionStorage.getItem('lastSheetSync') || 0);
          const waitLeft = Math.ceil((60000 - (Date.now() - lastSync)) / 1000);
          if (lastSync && waitLeft > 0) { alert('เพิ่ง Sync ไปเมื่อครู่ กรุณารออีก ' + waitLeft + ' วินาที'); return; }
          if (!confirm('ยืนยัน Sync ใบงาน ' + src.length.toLocaleString() + ' รายการ ลง Google Sheet?')) return;
          sessionStorage.setItem('lastSheetSync', String(Date.now()));

          setSyncing(true); showToast('กำลัง Sync ข้อมูลลง Google Sheet...');
          try {
            const res = await fetch(GSHEET_SYNC_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ rows })
            });
            const result = await res.json();
            if (result.success) {
              showToast(`Sync สำเร็จ · เพิ่ม ${result.added} · อัปเดต ${result.updated} แถว`);
              // 🚀 เปิดไฟล์ Google Sheet ในแท็บใหม่หลัง sync เสร็จ
              window.open('https://docs.google.com/spreadsheets/d/1kl3qWoDC7WjcLGt78UHeHYe_BQGCJuF5eQ28W-bKkfk/edit', '_blank');
            } else {
              alert('Sync ไม่สำเร็จ: ' + (result.message || 'ไม่ทราบสาเหตุ'));
            }
          } catch (err) {
            alert('เชื่อมต่อ Google Sheet ไม่สำเร็จ: ' + err);
          } finally {
            setSyncing(false);
          }
        };

        const filteredUsers = useMemo(() => {
          const term = search.toLowerCase();
          return users.filter(u => String(u.username || '').toLowerCase().includes(term) || String(u.full_name || '').toLowerCase().includes(term) || String(u.roles || '').toLowerCase().includes(term));
        }, [users, search]);

        const [userForm, setUserForm] = useState(null); // {mode, user}
        const [deleteTarget, setDeleteTarget] = useState(null);
        const [dbToast, setDbToast] = useState({ msg: '', type: 'success' });
        const showToast = (msg, type='success') => { setDbToast({ msg, type }); setTimeout(() => setDbToast({ msg: '', type }), 4000); };

        // สร้างแถบเลขหน้า < 1 2 3 4 5 ... 92 > ใช้ร่วมกันหลายแท็บ
        const renderPager = (page, totalPages, totalItems, setPage) => {
          if (totalPages <= 1) return null;
          const pages = [];
          const push = (p) => pages.push(p);
          if (totalPages <= 7) {
            for (let i = 1; i <= totalPages; i++) push(i);
          } else {
            push(1);
            let start = Math.max(2, page - 1);
            let end = Math.min(totalPages - 1, page + 1);
            if (page <= 3) { start = 2; end = 4; }
            if (page >= totalPages - 2) { start = totalPages - 3; end = totalPages - 1; }
            if (start > 2) push('...L');
            for (let i = start; i <= end; i++) push(i);
            if (end < totalPages - 1) push('...R');
            push(totalPages);
          }
          const btn = "min-w-[34px] h-[34px] px-2 rounded-lg font-bold text-sm flex items-center justify-center transition border";
          return (
            <div className="flex items-center justify-center flex-wrap gap-1.5 py-3 border-t border-gray-100 shrink-0">
              <button onClick={() => setPage(p => Math.max(1, p - 1))} disabled={page === 1} className={`${btn} bg-white border-purple-200 text-purple-600 hover:bg-purple-50 disabled:opacity-40`}>‹</button>
              {pages.map((p, idx) => (
                typeof p === 'number'
                  ? <button key={idx} onClick={() => setPage(p)} className={`${btn} ${p === page ? 'bg-[#5F259F] border-[#5F259F] text-white shadow-sm' : 'bg-white border-purple-200 text-purple-600 hover:bg-purple-50'}`}>{p}</button>
                  : <span key={idx} className="px-1 text-gray-400 font-bold">...</span>
              ))}
              <button onClick={() => setPage(p => Math.min(totalPages, p + 1))} disabled={page === totalPages} className={`${btn} bg-white border-purple-200 text-purple-600 hover:bg-purple-50 disabled:opacity-40`}>›</button>
              <span className="ml-2 text-sm font-bold text-gray-500">({totalItems.toLocaleString()} รายการ)</span>
            </div>
          );
        };

        const reloadUsers = () => {
          setLoadingUsers(true);
          if (typeof google !== 'undefined' && google.script) {
            google.script.run.withSuccessHandler(data => { setUsers(Array.isArray(data) ? data : []); setLoadingUsers(false); }).withFailureHandler(() => { setLoadingUsers(false); }).adminListUsers();
          } else { setLoadingUsers(false); }
        };

        const handleDeleteUser = () => {
          if (!deleteTarget) return;
          if (typeof google !== 'undefined' && google.script) {
            google.script.run.withSuccessHandler(() => { setDeleteTarget(null); reloadUsers(); showToast('ลบผู้ใช้งานเรียบร้อยแล้ว', 'delete'); }).withFailureHandler((e) => { alert('ลบไม่สำเร็จ: ' + (e.message || e)); setDeleteTarget(null); }).adminDeleteUser(deleteTarget.username);
          }
        };

        return (
          <div className="w-full flex flex-col lg:flex-row gap-4 animate-fade-in pb-2 lg:overflow-hidden" style={{height: 'calc(100vh - 130px)'}}>
            {/* Sidebar (คอม) / แท็บแนวนอน (มือถือ) */}
            <aside className="lg:w-60 shrink-0">
              <div className="bg-white rounded-2xl lg:rounded-[1.75rem] shadow-sm border border-gray-100 overflow-hidden lg:h-full">
                <div className="hidden lg:flex items-center gap-2.5 px-4 py-4 border-b border-gray-100">
                  <div className="w-9 h-9 bg-gradient-to-br from-gray-700 to-gray-900 rounded-xl flex items-center justify-center shadow-md shrink-0"><Icon name="Database" className="w-5 h-5 text-white" /></div>
                  <div><h2 className="text-[15px] font-black text-gray-800 leading-tight tracking-tight">จัดการฐานข้อมูล</h2><p className="text-[8px] font-bold text-gray-400 uppercase tracking-[0.15em] mt-0.5">Database Admin</p></div>
                </div>
                <nav className="flex lg:flex-col gap-1.5 lg:gap-1 p-2 lg:p-2.5 overflow-x-auto no-scrollbar">
                  {TABLES.map(t => (
                    <button key={t.id} onClick={() => { setActiveTable(t.id); setSearch(''); }} className={`flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-[13px] font-bold transition-all shrink-0 lg:w-full whitespace-nowrap ${activeTable === t.id ? 'bg-[#5F259F] text-white shadow-md' : 'text-gray-500 hover:bg-purple-50 hover:text-[#5F259F]'}`}>
                      <Icon name={t.icon} className="w-4 h-4 shrink-0" /> {t.label}
                    </button>
                  ))}
                </nav>
              </div>
            </aside>

            {/* เนื้อหาตาราง */}
            <div className="flex-grow flex flex-col gap-3 min-w-0 lg:overflow-hidden">
              <div className="flex items-center justify-between gap-3 flex-wrap">
                <h2 className="text-xl lg:text-2xl font-black text-gray-800 tracking-tight flex items-center gap-2"><Icon name={current.icon} className="w-5 h-5" /> {current.label}</h2>
                <div className="flex items-center gap-2">
                  {activeTable === 'jobs' && <>
                    <button onClick={syncJobsToSheet} disabled={syncing} className="bg-white border border-gray-200 text-gray-600 rounded-xl px-3.5 py-2.5 text-[13px] font-bold flex items-center gap-1.5 hover:bg-gray-50 active:scale-95 transition shadow-sm disabled:opacity-60"><Icon name="Refresh" className={`w-4 h-4 ${syncing ? 'animate-spin' : ''}`} /> <span className="hidden sm:inline">{syncing ? 'กำลัง Sync...' : 'Sync Google Sheet'}</span></button>
                    <button onClick={exportJobsExcel} className="bg-emerald-600 text-white rounded-xl px-3.5 py-2.5 text-[13px] font-bold flex items-center gap-1.5 hover:bg-emerald-700 active:scale-95 transition shadow-sm"><Icon name="FileText" className="w-4 h-4" /> <span className="hidden sm:inline">Export Excel</span></button>
                  </>}
                  {(activeTable === 'customers' || activeTable === 'meters') && <button onClick={openImport} className="bg-gray-800 text-white rounded-xl px-3.5 py-2.5 text-[13px] font-bold flex items-center gap-1.5 hover:bg-gray-900 active:scale-95 transition shadow-sm"><Icon name="Upload" className="w-4 h-4" /> <span className="hidden sm:inline">อัปโหลดไฟล์</span></button>}
                  {activeTable === 'users' && <button onClick={() => setUserForm({ mode: 'create', user: null })} className="bg-gray-800 text-white rounded-xl px-3.5 py-2.5 text-[13px] font-bold flex items-center gap-1.5 hover:bg-gray-900 active:scale-95 transition shadow-sm"><Icon name="PlusCircle" className="w-4 h-4" /> <span className="hidden sm:inline">เพิ่มข้อมูล</span></button>}
                </div>
              </div>

              <div className="relative">
                <Icon name="Search" className="absolute left-3.5 top-1/2 -translate-y-1/2 w-5 h-5 text-gray-400 pointer-events-none" />
                <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder={`ค้นหาในตาราง${current.label}...`} className="w-full pl-11 pr-4 py-3 bg-white border border-gray-200 rounded-xl focus:ring-2 focus:ring-gray-700 focus:border-gray-700 outline-none text-sm font-medium transition-all" />
              </div>

              {activeTable === 'users' ? (
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 flex-grow overflow-hidden flex flex-col min-h-[300px]">
                  {loadingUsers ? (
                    <div className="flex-grow flex items-center justify-center"><Icon name="Loader" className="w-8 h-8 animate-spin text-[#5F259F]" /></div>
                  ) : (
                    <div className="flex-grow flex flex-col min-h-0">
                      {/* หัวตาราง (นิ่ง ไม่มี scrollbar พาด) */}
                      <div className="overflow-x-auto no-scrollbar shrink-0">
                        <table className="w-full text-left border-collapse min-w-[600px] table-fixed">
                          <colgroup><col style={{width:'18%'}}/><col style={{width:'27%'}}/><col style={{width:'27%'}}/><col style={{width:'13%'}}/><col style={{width:'15%'}}/></colgroup>
                          <thead className="bg-[#5F259F] border-b border-[#4a1d7c]">
                            <tr>
                              <th className="px-4 py-3.5 text-xs font-bold text-white uppercase tracking-wider">Username</th>
                              <th className="px-4 py-3.5 text-xs font-bold text-white uppercase tracking-wider">ชื่อ-สกุล</th>
                              <th className="px-4 py-3.5 text-xs font-bold text-white uppercase tracking-wider">สิทธิ์</th>
                              <th className="px-4 py-3.5 text-xs font-bold text-white uppercase tracking-wider text-center">สถานะ</th>
                              <th className="px-4 py-3.5 text-xs font-bold text-white uppercase tracking-wider text-center">จัดการ</th>
                            </tr>
                          </thead>
                        </table>
                      </div>
                      {/* เนื้อหา (เลื่อนได้ scrollbar อยู่ใต้หัว) */}
                      <div className="overflow-auto flex-grow">
                        <table className="w-full text-left border-collapse min-w-[600px] table-fixed">
                          <colgroup><col style={{width:'18%'}}/><col style={{width:'27%'}}/><col style={{width:'27%'}}/><col style={{width:'13%'}}/><col style={{width:'15%'}}/></colgroup>
                          <tbody className="divide-y divide-gray-50">
                            {filteredUsers.length > 0 ? filteredUsers.map((u, i) => (
                              <tr key={i} className="hover:bg-purple-50/60 transition-colors text-sm">
                                <td className="px-4 py-1.5 font-mono font-bold text-gray-700">{u.username}</td>
                                <td className="px-4 py-1.5 font-medium text-gray-800">{u.full_name || '-'}</td>
                                <td className="px-4 py-1.5"><div className="flex flex-wrap gap-1">{String(u.roles || '').split(',').map(r => r.trim()).filter(Boolean).map((r, ri) => <span key={ri} className="text-[11px] font-bold bg-purple-100 text-[#5F259F] px-2 py-0.5 rounded-md">{r}</span>)}{!u.roles && <span className="text-gray-300 text-xs italic">ไม่มีสิทธิ์</span>}</div></td>
                                <td className="px-4 py-1.5 text-center">{u.is_active ? <span className="text-[11px] font-bold bg-emerald-100 text-emerald-700 px-2.5 py-0.5 rounded-full">ใช้งาน</span> : <span className="text-[11px] font-bold bg-gray-100 text-gray-500 px-2.5 py-0.5 rounded-full">ปิด</span>}</td>
                                <td className="px-4 py-1.5"><div className="flex items-center justify-center gap-1.5">
                                  <button onClick={() => setUserForm({ mode: 'edit', user: u })} className="p-1.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition border border-blue-100" title="แก้ไข"><Icon name="Edit" className="w-3.5 h-3.5" /></button>
                                  <button onClick={() => setDeleteTarget(u)} className="p-1.5 bg-red-50 text-red-500 rounded-lg hover:bg-red-100 transition border border-red-100" title="ลบ"><Icon name="Trash" className="w-3.5 h-3.5" /></button>
                                </div></td>
                              </tr>
                            )) : <tr><td colSpan="5" className="p-12 text-center text-gray-400 italic font-medium">ไม่พบข้อมูลผู้ใช้งาน</td></tr>}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </div>
              ) : activeTable === 'roles' ? (
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 flex-grow overflow-hidden flex flex-col min-h-[300px]">
                  {loadingRoles ? (
                    <div className="flex-grow flex items-center justify-center"><Icon name="Loader" className="w-8 h-8 animate-spin text-[#5F259F]" /></div>
                  ) : (
                    <div className="flex-grow flex flex-col min-h-0">
                      <div className="overflow-x-auto no-scrollbar shrink-0">
                        <table className="w-full text-left border-collapse min-w-[500px] table-fixed">
                          <colgroup><col style={{width:'28%'}}/><col style={{width:'37%'}}/><col style={{width:'20%'}}/><col style={{width:'15%'}}/></colgroup>
                          <thead className="bg-[#5F259F] border-b border-[#4a1d7c]">
                            <tr>
                              <th className="px-4 py-3.5 text-xs font-bold text-white uppercase tracking-wider">Code</th>
                              <th className="px-4 py-3.5 text-xs font-bold text-white uppercase tracking-wider">ชื่อ (ไทย)</th>
                              <th className="px-4 py-3.5 text-xs font-bold text-white uppercase tracking-wider text-center">ผู้ใช้</th>
                              <th className="px-4 py-3.5 text-xs font-bold text-white uppercase tracking-wider text-center">จัดการ</th>
                            </tr>
                          </thead>
                        </table>
                      </div>
                      <div className="overflow-auto flex-grow">
                        <table className="w-full text-left border-collapse min-w-[500px] table-fixed">
                          <colgroup><col style={{width:'28%'}}/><col style={{width:'37%'}}/><col style={{width:'20%'}}/><col style={{width:'15%'}}/></colgroup>
                          <tbody className="divide-y divide-gray-50">
                            {filteredRoles.length > 0 ? filteredRoles.map((r, i) => (
                              <tr key={i} className="hover:bg-purple-50/60 transition-colors text-sm">
                                <td className="px-4 py-2 font-mono font-bold text-[#5F259F]">{r.code}</td>
                                <td className="px-4 py-2 font-medium text-gray-800">{r.label || '-'}</td>
                                <td className="px-4 py-2 text-center"><span className="text-[11px] font-bold bg-gray-100 text-gray-600 px-2.5 py-0.5 rounded-full">{r.user_count || 0} คน</span></td>
                                <td className="px-4 py-2 text-center"><button onClick={() => setEditRole(r)} className="p-1.5 bg-blue-50 text-blue-600 rounded-lg hover:bg-blue-100 transition border border-blue-100" title="แก้ชื่อ"><Icon name="Edit" className="w-3.5 h-3.5" /></button></td>
                              </tr>
                            )) : <tr><td colSpan="4" className="p-12 text-center text-gray-400 italic font-medium">ไม่พบข้อมูลสิทธิ์</td></tr>}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </div>
              ) : activeTable === 'customers' ? (
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 flex-grow overflow-hidden flex flex-col min-h-[300px]">
                  {loadingCust ? (
                    <div className="flex-grow flex flex-col items-center justify-center gap-3">
                      <Icon name="Loader" className="w-8 h-8 animate-spin text-[#5F259F]" />
                      <p className="text-gray-400 text-sm font-medium">กำลังโหลดข้อมูลลูกค้าทั้งหมด...</p>
                    </div>
                  ) : (
                    <div className="flex-grow flex flex-col min-h-0">
                      <div className="overflow-auto flex-grow">
                        <table className="w-full text-left border-collapse min-w-[1600px] text-sm">
                          <thead className="bg-[#5F259F] sticky top-0 z-10">
                            <tr>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">No.</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">MRU</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">Seq No.</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">PEA</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">CA</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">หมวดอัตรา</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">ชื่อ-สกุล</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">ที่อยู่</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">Install No.</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">Premise No.</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">ที่ตั้งอุปกรณ์</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">รหัสประเภทติดตั้ง</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">ประเภทติดตั้ง</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">ชนิดมิเตอร์</th>
                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">หมายเหตุ</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-gray-50">
                            {custItems.length > 0 ? custItems.map((c, i) => (
                              <tr key={i} className="hover:bg-purple-50/60 transition-colors">
                                <td className="px-3 py-1.5 text-gray-400 text-[12px] whitespace-nowrap">{c.no}</td>
                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{c.mru || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{c.sequence_no || '-'}</td>
                                <td className="px-3 py-1.5 font-mono font-bold text-[#5F259F] whitespace-nowrap">{c.pea_id || '-'}</td>
                                <td className="px-3 py-1.5 font-mono text-gray-700 whitespace-nowrap">{c.ca_id || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{c.rate_category || '-'}</td>
                                <td className="px-3 py-1.5 font-medium text-gray-800 whitespace-nowrap">{c.name || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 max-w-[300px] truncate" title={c.address}>{c.address || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{c.install_no || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{c.premise_no || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{c.device_location || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{c.install_type_code || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{c.install_type || '-'}</td>

                      <div className="overflow-auto flex-grow">

              ) : activeTable === 'meters' ? (

                  {loadingMeter ? (

                          <thead className="bg-[#5F259F] sticky top-0 z-10">

                              <th className="px-3 py-3 text-xs font-bold text-white uppercase tracking-wider whitespace-nowrap">No.</th>

                          <tbody className="divide-y divide-gray-50">
                            {meterItems.length > 0 ? meterItems.map((m, i) => (

                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{m.billing_rate || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{m.tsic_code || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 max-w-[200px] truncate" title={m.tsic_desc}>{m.tsic_desc || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{m.meter_model || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{m.meter_size || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 whitespace-nowrap">{m.meter_size_desc || '-'}</td>
                                <td className="px-3 py-1.5 text-gray-600 max-w-[200px] truncate" title={m.device_category_desc}>{m.device_category_desc || '-'}</td>
                              </tr>
                            )) : <tr><td colSpan="16" className="p-12 text-center text-gray-400 italic font-medium">ไม่พบข้อมูลมิเตอร์</td></tr>}
                          </tbody>
                        </table>
                      </div>
                      {renderPager(meterPage, meterTotalPages, meterTotal, setMeterPage)}
                    </div>
                  )}
                </div>
              ) : activeTable === 'history' ? (
                <div className="flex-grow"><HistoryDashboard /></div>
              ) : (
                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 flex-grow flex flex-col items-center justify-center p-12 text-center min-h-[300px]">
                  <div className="w-16 h-16 bg-purple-50 rounded-full flex items-center justify-center mb-4"><Icon name={current.icon} className="w-8 h-8 text-purple-300" /></div>
                  <p className="text-gray-500 font-bold">ตาราง "{current.label}"</p>
                  <p className="text-gray-400 text-sm mt-1 font-medium">ยังไม่ได้เชื่อมต่อข้อมูล — เดี๋ยวเราจะทำในก้าวถัดไป</p>
                </div>
              )}

              <div className="px-4 py-3 bg-amber-50 border border-amber-200 rounded-xl text-[12px] text-amber-700 font-medium flex items-start gap-2">
                <Icon name="Alert" className="w-4 h-4 shrink-0 mt-0.5" /> การแก้ไขในหน้านี้กระทบฐานข้อมูลจริงทันที — เฉพาะ Admin เท่านั้น และทุกการกระทำถูกบันทึกใน activity logs
              </div>
            </div>

            {userForm && <UserFormModal user={userForm.user} existingUsernames={users.map(u => u.username)} onClose={() => setUserForm(null)} onSaved={() => { const wasEdit = userForm.mode === 'edit'; setUserForm(null); reloadUsers(); showToast(wasEdit ? 'แก้ไขผู้ใช้งานเรียบร้อยแล้ว' : 'เพิ่มผู้ใช้งานเรียบร้อยแล้ว'); }} />}
            {editJob && <JobCompletionModal job={editJob} currentUser={currentUser} mode="edit" dbMode={true} userList={users} onClose={() => setEditJob(null)} onConfirm={(id, data) => { if (typeof google !== 'undefined' && google.script) { google.script.run.withSuccessHandler((res) => { if (res && res.success === false) { alert('บันทึกไม่สำเร็จ: ' + (res.message || '')); } else { setEditJob(null); reloadJobs(); showToast('แก้ไขใบงานเรียบร้อยแล้ว'); } }).withFailureHandler((e) => alert('Error: ' + e)).updateJobDetails(id, data, currentUser?.name); } }} onDelete={(id) => { if (typeof google !== 'undefined' && google.script) { google.script.run.withSuccessHandler(() => { setEditJob(null); reloadJobs(); showToast('ลบใบงานเรียบร้อยแล้ว', 'delete'); }).withFailureHandler((e) => alert('Error: ' + e)).deleteJob(id, currentUser?.name); } }} />}
            <ConfirmDeleteModal isOpen={!!deleteTarget} onClose={() => setDeleteTarget(null)} onConfirm={handleDeleteUser} title="ลบผู้ใช้งานนี้?" message={deleteTarget ? `ต้องการลบ "${deleteTarget.full_name || deleteTarget.username}" (${deleteTarget.username}) ออกจากระบบถาวรหรือไม่?` : ''} />
            {editRole && <RoleEditModal role={editRole} onClose={() => setEditRole(null)} onSaved={() => { setEditRole(null); reloadRoles(); showToast('แก้ไขชื่อสิทธิ์เรียบร้อยแล้ว'); }} />}
            {showImport && (activeTable === 'customers' || activeTable === 'meters') && (
              <ImportModal
                tableType={activeTable}
                existingData={importKeys}
                onClose={() => setShowImport(false)}
                onDone={(res) => {
                  setShowImport(false);
                  showToast(`นำเข้าสำเร็จ · เพิ่ม ${res.added.toLocaleString()} · อัปเดต ${res.updated.toLocaleString()} แถว${res.skipped ? ` · ข้าม ${res.skipped.toLocaleString()}` : ''}`);
                  if (activeTable === 'customers') { loadCustomers(custPage, search); } else { loadMeters(meterPage, search); }
                }}
              />
            )}
            {dbToast.msg && ReactDOM.createPortal(
              <div className="fixed bottom-6 left-0 right-0 w-screen flex justify-center px-4 z-[99999] animate-fade-in-up pointer-events-none">
                <div className="bg-gray-900/60 backdrop-blur-xl text-white pl-3 pr-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-white/20 ring-1 ring-white/5 max-w-[90vw]">
                  <div className={`${dbToast.type === 'delete' ? 'bg-red-500' : 'bg-green-500'} rounded-full p-1.5 shrink-0`}>
                    <Icon name={dbToast.type === 'delete' ? 'Trash' : 'Check'} className="w-4 h-4 text-white" />
                  </div>
                  <span className="font-bold text-sm">{dbToast.msg}</span>
                </div>
              </div>,
              document.body
            )}
          </div>
        );
      };

      // ==========================================
      // คอมโพเนนต์หลักตัวแอป (MainApp)
      // ==========================================
      const MainApp = ({ currentUser, setCurrentUser }) => {
        const isAdminUser = getUserRoles(currentUser).includes('Admin');
        const [currentView, setCurrentView] = useState(() => {
           if (getUserRoles(currentUser).includes('Employee')) return 'form';
           return isAdminUser ? 'admin_dashboard' : 'user_dashboard'; 
        });
        const [jobs, setJobs] = useState([]); 
        const [loading, setLoading] = useState(false); 
        const [refreshing, setRefreshing] = useState(false);
        const [lastUpdated, setLastUpdated] = useState(null);
        const [isExiting, setIsExiting] = useState(false); 
        const [toastMsg, setToastMsg] = useState('');
        const [toastType, setToastType] = useState('success');
        const [newJobNo, setNewJobNo] = useState(null);

        // 🚀 Delta sync: รอบต่อๆ ไปดึงเฉพาะใบงานที่เปลี่ยนแปลง (ลด Egress อย่างมาก)
        //    ใช้ค่า updated_at สูงสุดจาก server เป็นจุดอ้างอิง กันปัญหานาฬิกาเครื่องคลาดเคลื่อน
        const lastSyncRef = useRef(null);
        const fetchJobs = useCallback((isBackground = false, delta = false) => {
          if (!isBackground) setLoading(true); else setRefreshing(true);
          const since = (delta && lastSyncRef.current) ? lastSyncRef.current : null;
          const bumpSync = (rows) => {
            (rows || []).forEach(r => {
              if (r && r.updatedAt && (!lastSyncRef.current || r.updatedAt > lastSyncRef.current)) {
                lastSyncRef.current = r.updatedAt;
              }
            });
          };
          if (typeof google !== 'undefined' && google.script) {
            google.script.run.withSuccessHandler(data => {
              const rows = Array.isArray(data) ? data : [];
              if (since) {
                if (rows.length > 0) {
                  setJobs(prev => {
                    const map = new Map((prev || []).map(j => [String(j.id), j]));
                    rows.forEach(r => map.set(String(r.id), Object.assign({}, map.get(String(r.id)) || {}, r)));
                    return Array.from(map.values());
                  });
                }
              } else {
                // 🛡️ กันเด้งกลับ: full refresh ดึงข้อมูล "เบา" (ไม่มี note/รูปครบ)
                //    ถ้าเขียนทับตรงๆ ค่าที่ผู้ใช้เพิ่งแก้/เห็นครบจะหาย — merge โดยคงของเดิมที่ข้อมูลเบาไม่มี
                setJobs(prev => {
                  const prevMap = new Map((prev || []).map(j => [String(j.id), j]));
                  return rows.map(r => {
                    const old = prevMap.get(String(r.id));
                    if (!old) return r;
                    const merged = Object.assign({}, old, r);
                    // คง note เดิมไว้ถ้า refresh (ข้อมูลเบา) ไม่ได้ส่ง note มา
                    // ส่วนรูป: ใช้ค่าจาก light (รูปเดียว) ตรงๆ — badge จะได้ถูก และรูปเต็มดึงตอนเปิด modal อยู่แล้ว
                    if ((r.note == null || r.note === '') && old.note) merged.note = old.note;
                    return merged;
                  });
                });
              }
              bumpSync(rows);
              setLastUpdated(new Date()); setLoading(false); setRefreshing(false);
            }).withFailureHandler(() => { setLoading(false); setRefreshing(false); }).getAdminJobs(since);
          } else { setTimeout(() => { setJobs([]); setLastUpdated(new Date()); setLoading(false); setRefreshing(false); }, 500); }
        }, []);

        useEffect(() => { fetchJobs(); }, [fetchJobs]);

        // 🔄 Auto-refresh เบื้องหลังทุก 90 วินาที (ยืดจาก 15 วิ เพื่อลด Egress)
        // 🚀 ลด Egress เพิ่ม: หยุดดึงข้อมูลถ้าผู้ใช้ไม่ได้แตะหน้าจอเกิน 5 นาที (เปิดค้างไว้เฉยๆ)
        const lastActivityRef = useRef(Date.now());
        useEffect(() => {
          const markActive = () => { lastActivityRef.current = Date.now(); };
          const events = ['mousedown','keydown','touchstart','scroll','focus'];
          events.forEach(ev => window.addEventListener(ev, markActive, { passive: true }));
          const onVisible = () => { if (document.visibilityState === 'visible') { markActive(); fetchJobs(true); } };
          document.addEventListener('visibilitychange', onVisible);
          return () => {
            events.forEach(ev => window.removeEventListener(ev, markActive));
            document.removeEventListener('visibilitychange', onVisible);
          };
        }, [fetchJobs]);

        const cycleRef = useRef(0);
        useEffect(() => {
          const IDLE_LIMIT = 5 * 60 * 1000; // ไม่แตะจอเกิน 5 นาที = หยุดดึง
          const timer = setInterval(() => {
            if (document.visibilityState !== 'visible') return;
            if (Date.now() - lastActivityRef.current > IDLE_LIMIT) return;
            cycleRef.current += 1;
            // ทุก 10 รอบ (~15 นาที) ดึงเต็ม 1 ครั้ง เพื่อล้างงานที่ถูกลบ/อัปเดตวันค้าง
            const useDelta = (cycleRef.current % 10) !== 0;
            fetchJobs(true, useDelta);
          }, 90000);
          return () => clearInterval(timer);
        }, [fetchJobs]);

        // 🍞 เมื่อบันทึกงานใหม่สำเร็จ: เด้งไปหน้ารายการ + โชว์ toast + ดึงข้อมูลให้งานใหม่ขึ้นทันที
          const handleReportSuccess = (jobNo) => {
          setCurrentView(isAdminUser ? 'admin_dashboard' : 'user_dashboard');
          setToastType('success');
          setToastMsg('บันทึกข้อมูลเรียบร้อยแล้ว');
          fetchJobs(true);
          setTimeout(() => fetchJobs(true), 1500);
          setTimeout(() => setToastMsg(''), 4500);
          if (jobNo) {
            setNewJobNo(String(jobNo));
            setTimeout(() => setNewJobNo(null), 5000);
          }
        };

        const updateStatus = (id, newStatus, data, type) => {
          const currentJob = jobs.find(j => j.id === id);
          if (!currentJob) return;
          
          // 🍞 โชว์ toast เมื่อมีการแก้ไข/เปลี่ยนสถานะ (ยกเว้น optimistic ที่เป็นแค่การอัปเดตหน้าจอชั่วคราว)
          if (type !== 'optimistic') {
            setToastType('success');
            setToastMsg('บันทึกข้อมูลเรียบร้อยแล้ว');
            setTimeout(() => setToastMsg(''), 4500);
          }
          
          let durationToSend = currentJob.duration;
          if (type !== 'edit' && type !== 'optimistic') {
             if (newStatus === 'ปิดงาน (TECO)' && currentJob.status !== 'ปิดงาน (TECO)') { 
               durationToSend = calculateTimeElapsed(currentJob.timestamp);
             }
             else if (newStatus !== 'ปิดงาน (TECO)' && currentJob.status === 'ปิดงาน (TECO)') { 
               durationToSend = "";
             }
          }
          
          const previousJobs = [...jobs];
          setJobs(prev => prev.map(j => {
             if (j.id === id) { 
               let localData = { ...data };
               if (localData && Array.isArray(localData.image)) {
                 localData.image = localData.image.join('|||');
               }
               if (localData && Array.isArray(localData.auditImages)) {
                 localData.auditLink = localData.auditImages.join('|||');
               }
               // 🛡️ กันข้อมูลแสดงผลหาย: ไม่เอา field ที่ว่าง/undefined ไปทับค่าเดิมที่มีอยู่
               //    (รายการเบาไม่มีบางฟิลด์ครบ ถ้า merge ตรงๆ ชื่อ/ที่อยู่/มิเตอร์จะกลายเป็นค่าว่าง)
               const cleanData = {};
               Object.keys(localData || {}).forEach(k => {
                 const v = localData[k];
                 if (v !== undefined && v !== null && v !== '') cleanData[k] = v;
               });
               
               if (type === 'edit' || type === 'optimistic') return { ...j, ...cleanData }; 
               else return { ...j, status: newStatus || j.status, duration: durationToSend === "" ? null : durationToSend, ...cleanData }; 
             } 
             return j;
          }));
          
          // 🚀 ถ้าเป็น 'optimistic' ให้หยุดการทำงานแค่นี้ (เปลี่ยนแค่ตาเห็นบนตาราง)
          if (type === 'optimistic') return;
          
          if (typeof google !== 'undefined' && google.script) {
            if (type === 'edit') {
              google.script.run.withSuccessHandler((res) => {
                if (res && !res.success) {
                   alert("อัปเดตไม่สำเร็จ: " + (res.message || "ไม่ทราบสาเหตุ"));
                   setJobs(previousJobs); 
                } else {
                   // 🚀 รายการหน้าตารางเป็นข้อมูลเบา (ตัดบางฟิลด์เพื่อลด Egress)
                   //    optimistic update จึงอาจทำให้ฟิลด์ที่ modal ไม่ได้ส่งกลับ (ชื่อ/มิเตอร์/ที่อยู่) หายจากจอ
                   //    แก้โดยดึงใบงานเต็มของใบนี้มาเขียนทับแถวให้ครบหลังบันทึกสำเร็จ
                   google.script.run.withSuccessHandler((full) => {
                     if (full && full.id) {
                       // ตัดรูปเหลือใบแรกให้ตรงกับรายการเบา (badge +N จะได้นับถูก, รูปเต็มดึงตอนเปิด modal)
                       const slim = Object.assign({}, full);
                       if (slim.image) slim.image = String(slim.image).split('|||')[0] || '';
                       if (slim.auditLink) slim.auditLink = String(slim.auditLink).split('|||')[0] || '';
                       setJobs(prev => prev.map(j => String(j.id) === String(full.id) ? Object.assign({}, j, slim) : j));
                     }
                   }).withFailureHandler(() => {}).getJobDetail(id);
                }
              }).withFailureHandler((err) => { 
                alert("Error: " + err); 
                setJobs(previousJobs); 
              }).updateJobDetails(id, data, currentUser?.name);
            } else {
              let safeCompletionData = null;
              if (data) { safeCompletionData = { ...data }; delete safeCompletionData.files; }
              // 🔔 แนบข้อมูลใบงานเต็มไว้ให้ Telegram ประกอบข้อความครบทุกฟิลด์ (จะถูกถอดออกก่อนส่งเข้า RPC)
              const dataWithFull = Object.assign({}, safeCompletionData || {}, { _jobFull: currentJob });
              
              google.script.run.withSuccessHandler((res) => {
                if (res && !res.success) {
                   alert("เปลี่ยนสถานะล้มเหลว: " + (res.message || "ไม่ทราบสาเหตุ"));
                   setJobs(previousJobs); 
                }
              }).withFailureHandler((err) => { 
                alert("Error: " + err); 
                setJobs(previousJobs); 
              }).updateAdminJobStatus(id, newStatus, durationToSend, dataWithFull, currentUser?.name);
            }
          }
        };

            const handleDeleteJob = (id) => {
            setRefreshing(true);
            const previousJobs = [...jobs];
            setJobs(prev => prev.filter(j => j.id !== id));
            setToastType('delete');
            setToastMsg('ลบใบงานเรียบร้อยแล้ว');
            setTimeout(() => setToastMsg(''), 4500);
            if (typeof google !== 'undefined' && google.script) {
                google.script.run.withSuccessHandler(() => fetchJobs(true))
                .withFailureHandler((err) => { 
                    alert("Error: " + err); setJobs(previousJobs); fetchJobs(true); 
                }).deleteJob(id, currentUser?.name);
            } else {
                setTimeout(() => fetchJobs(true), 1000);
            }
        };

        const handleLogout = () => {
          sessionStorage.removeItem('authUser');
          setCurrentUser(null); 
        };

        return (
          <div className="w-full h-screen overflow-hidden bg-[#F8FAFC] flex flex-col">
            {isAdminUser ? (
              <header className="w-full bg-gradient-to-r from-[#5F259F] to-[#7A2F8F] text-white shadow-xl sticky top-0 z-40">
                <div className="w-full px-4 lg:px-8 py-2 flex justify-between items-center gap-2">
                  <div className="flex items-center gap-2 cursor-pointer group shrink flex-1 min-w-0" onClick={() => setCurrentView('admin_dashboard')}>
                    <div className="bg-white p-1.5 lg:p-2 rounded-xl shadow-lg group-hover:rotate-12 transition-transform shrink-0">
                      <Icon name="Zap" className="w-5 h-5 lg:w-6 lg:h-6 text-[#5F259F] fill-current" />
                    </div>
                      <div className="flex flex-col min-w-0">
                      <div className="flex items-center gap-1.5">
                        <h1 className="text-[13px] md:text-[15px] lg:text-xl font-black italic tracking-tighter uppercase leading-none pr-1 whitespace-nowrap">PEA MTS</h1>
                        <span className="md:hidden bg-amber-400 text-purple-900 px-1.5 rounded-md text-[8px] font-bold shrink-0 truncate max-w-[120px]">{currentUser?.name || 'ไม่ระบุชื่อ'}</span>
                      </div>
                      <div className="flex items-center gap-1.5 mt-1">
                        <p className="text-[8px] lg:text-[10px] font-bold text-purple-200 uppercase opacity-90 tracking-widest truncate">Meter Tracking System</p>
                        <span className="hidden md:inline-block bg-amber-400 text-purple-900 px-1.5 rounded-md text-[8px] font-bold shrink-0 truncate max-w-[120px]">{currentUser?.name || 'ไม่ระบุชื่อ'}</span>
                      </div>
                    </div>
                  </div>
                  <nav className="flex bg-black/20 p-1 md:p-1.5 rounded-full md:rounded-2xl backdrop-blur-md items-center shrink-0 max-w-full">
                      <div className="flex md:hidden items-center gap-1 overflow-x-auto no-scrollbar px-1">
                          <button onClick={() => setCurrentView('form')} className={`flex items-center justify-center transition-all h-8 w-8 rounded-full shrink-0 ${currentView === 'form' ? 'bg-white text-[#5F259F]' : 'text-white/80 hover:text-white'}`}><Icon name="PlusCircle" className="w-4 h-4" /></button>
                          <button onClick={() => setCurrentView('search')} className={`flex items-center justify-center transition-all h-8 w-8 rounded-full shrink-0 ${currentView === 'search' ? 'bg-white text-[#5F259F]' : 'text-white/80 hover:text-white'}`}><Icon name="Search" className="w-4 h-4" /></button>
                          <button onClick={() => setCurrentView('admin_dashboard')} className={`flex items-center justify-center transition-all h-8 w-8 rounded-full shrink-0 ${currentView === 'admin_dashboard' ? 'bg-white text-[#5F259F]' : 'text-white/80 hover:text-white'}`}><Icon name="Grid" className="w-4 h-4" /></button>
                          <button onClick={() => setCurrentView('analytics')} className={`flex items-center justify-center transition-all h-8 w-8 rounded-full shrink-0 ${currentView === 'analytics' ? 'bg-white text-[#5F259F]' : 'text-white/80 hover:text-white'}`}><Icon name="Chart" className="w-4 h-4" /></button>
                          <button onClick={() => setCurrentView('database')} className={`flex items-center justify-center transition-all h-8 w-8 rounded-full shrink-0 ${currentView === 'database' ? 'bg-white text-[#5F259F]' : 'text-white/80 hover:text-white'}`}><Icon name="Database" className="w-4 h-4" /></button>
                          <div className="w-[1px] h-4 bg-white/20 mx-0.5 shrink-0"></div>
                          <button onClick={handleLogout} className="flex items-center justify-center h-8 w-8 text-red-300 hover:text-white hover:bg-red-500 rounded-full shrink-0"><Icon name="LogOut" className="w-4 h-4" /></button>
                      </div>
                      <div className="hidden md:flex items-center gap-0.5 lg:gap-1.5">
                          <button onClick={() => setCurrentView('form')} className={`px-2 lg:px-4 py-2 rounded-xl text-[10px] lg:text-xs font-bold transition-all flex items-center gap-1 lg:gap-2 ${currentView === 'form' ? 'bg-white text-[#5F259F] shadow-md scale-105' : 'text-purple-100 hover:text-white hover:bg-white/10'}`}><Icon name="PlusCircle" className="w-3.5 h-3.5 lg:w-4 lg:h-4" /> <span className="hidden xl:inline">แจ้งมิเตอร์ชำรุด</span><span className="xl:hidden">แจ้งซ่อม</span></button>
                          <button onClick={() => setCurrentView('search')} className={`px-2 lg:px-4 py-2 rounded-xl text-[10px] lg:text-xs font-bold transition-all flex items-center gap-1 lg:gap-2 ${currentView === 'search' ? 'bg-white text-[#5F259F] shadow-md scale-105' : 'text-purple-100 hover:text-white hover:bg-white/10'}`}><Icon name="Search" className="w-3.5 h-3.5 lg:w-4 lg:h-4" /> <span className="hidden xl:inline">ตรวจสอบข้อมูล</span><span className="xl:hidden">ค้นหา</span></button>
                          <button onClick={() => setCurrentView('admin_dashboard')} className={`px-2 lg:px-4 py-2 rounded-xl text-[10px] lg:text-xs font-bold transition-all flex items-center gap-1 lg:gap-2 ${currentView === 'admin_dashboard' ? 'bg-white text-[#5F259F] shadow-md scale-105' : 'text-purple-100 hover:text-white hover:bg-white/10'}`}><Icon name="Grid" className="w-3.5 h-3.5 lg:w-4 lg:h-4" /> รายการแจ้งซ่อม</button>
                          <button onClick={() => setCurrentView('analytics')} className={`px-2 lg:px-4 py-2 rounded-xl text-[10px] lg:text-xs font-bold transition-all flex items-center gap-1 lg:gap-2 ${currentView === 'analytics' ? 'bg-white text-[#5F259F] shadow-md scale-105' : 'text-purple-100 hover:text-white hover:bg-white/10'}`}><Icon name="Chart" className="w-3.5 h-3.5 lg:w-4 lg:h-4" /> สถิติ</button>
                          <button onClick={() => setCurrentView('database')} className={`px-2 lg:px-4 py-2 rounded-xl text-[10px] lg:text-xs font-bold transition-all flex items-center gap-1 lg:gap-2 ${currentView === 'database' ? 'bg-white text-[#5F259F] shadow-md scale-105' : 'text-purple-100 hover:text-white hover:bg-white/10'}`}><Icon name="Database" className="w-3.5 h-3.5 lg:w-4 lg:h-4" /> <span className="hidden xl:inline">จัดการข้อมูล</span><span className="xl:hidden">จัดการ</span></button>
                          <div className="w-[1px] h-5 bg-white/20 mx-1"></div>
                          <div className="px-1 lg:px-2 flex items-center gap-1.5 lg:gap-2">
                             <div className="w-6 h-6 lg:w-7 lg:h-7 rounded-full bg-purple-300 flex items-center justify-center text-[#5F259F] font-black text-[10px] lg:text-xs">{currentUser?.name ? currentUser.name.charAt(0) : 'U'}</div>
                             <div className="hidden lg:block text-[10px] xl:text-xs font-bold truncate max-w-[80px] xl:max-w-[120px]">{currentUser?.name || 'Unknown'}</div>
                          </div>
                          <button onClick={handleLogout} disabled={isExiting} className="p-1.5 lg:p-2 rounded-xl text-xs font-bold transition-all flex items-center gap-2 text-red-300 hover:text-red-100 hover:bg-red-500/20 disabled:opacity-50"><Icon name="LogOut" className="w-4 h-4 lg:w-5 lg:h-5" /></button>
                      </div>
                  </nav>
                </div>
              </header>
            ) : (
              <header className="w-full bg-gradient-to-r from-[#5F259F] to-[#7A2F8F] text-white shadow-xl sticky top-0 z-40">
                <div className="w-full px-4 sm:px-8 py-2 sm:py-3.5 flex justify-between items-center gap-1 sm:gap-4">
                  <div className="flex items-center gap-1.5 sm:gap-3 cursor-pointer group shrink-0" onClick={() => setCurrentView('user_dashboard')}>
                    <div className="bg-white p-1 sm:p-2 rounded-xl sm:rounded-2xl shadow-lg group-hover:rotate-12 transition-transform">
                      <Icon name="Zap" className="w-5 h-5 sm:w-7 sm:h-7 text-[#5F259F] fill-current" />
                    </div>
                      <div className="flex flex-col">
                      <div className="flex items-center gap-1.5 sm:gap-2">
                        <h1 className="text-[16px] sm:text-xl font-black italic tracking-tighter uppercase leading-none whitespace-nowrap pr-1">PEA MTS</h1>
                        <span className="sm:hidden bg-amber-400 text-purple-900 px-1 rounded-sm text-[6px] font-bold truncate max-w-[80px]">{currentUser?.name || 'ไม่ระบุชื่อ'}</span>
                      </div>
                      <div className="flex items-center gap-1 sm:gap-2 mt-0.5 sm:mt-1">
                        <p className="text-[8px] sm:text-[10px] font-bold text-purple-200 uppercase opacity-90 tracking-widest whitespace-nowrap">Meter Tracking System</p>
                        <span className="hidden sm:inline-block bg-amber-400 text-purple-900 px-1.5 rounded text-[8px] font-bold truncate max-w-[120px]">{currentUser?.name || 'ไม่ระบุชื่อ'}</span>
                      </div>
                    </div>
                  </div>
                  
                  <nav className="flex bg-black/20 p-1 sm:p-1.5 rounded-full md:rounded-2xl backdrop-blur-md items-center gap-1 sm:gap-2 shrink-0 overflow-x-auto no-scrollbar max-w-[60%] sm:max-w-none">
                      <div className="flex md:hidden items-center gap-1 sm:gap-1.5">
                          <button onClick={() => setCurrentView('form')} className={`flex items-center justify-center transition-all h-9 w-9 sm:h-10 sm:w-12 rounded-full ${currentView === 'form' ? 'bg-white text-[#5F259F] shadow-md scale-110' : 'text-white/80 hover:text-white hover:bg-white/10'}`}><Icon name="PlusCircle" className="w-[18px] h-[18px] sm:w-5 sm:h-5" /></button>
                          <button onClick={() => setCurrentView('search')} className={`flex items-center justify-center transition-all h-9 w-9 sm:h-10 sm:w-12 rounded-full ${currentView === 'search' ? 'bg-white text-[#5F259F] shadow-md scale-110' : 'text-white/80 hover:text-white hover:bg-white/10'}`}><Icon name="Search" className="w-[18px] h-[18px] sm:w-5 sm:h-5" /></button>
                          <button onClick={() => setCurrentView('user_dashboard')} className={`flex items-center justify-center transition-all h-9 w-9 sm:h-10 sm:w-12 rounded-full ${currentView === 'user_dashboard' ? 'bg-white text-[#5F259F] shadow-md scale-110' : 'text-white/80 hover:text-white hover:bg-white/10'}`}><Icon name="Grid" className="w-[18px] h-[18px] sm:w-5 sm:h-5" /></button>
                          <button onClick={() => setCurrentView('analytics')} className={`flex items-center justify-center transition-all h-9 w-9 sm:h-10 sm:w-12 rounded-full ${currentView === 'analytics' ? 'bg-white text-[#5F259F] shadow-md scale-110' : 'text-white/80 hover:text-white hover:bg-white/10'}`}><Icon name="Chart" className="w-[18px] h-[18px] sm:w-5 sm:h-5" /></button>
                          <div className="w-[1px] h-5 bg-white/20 mx-1"></div>
                          <button onClick={handleLogout} className="flex items-center justify-center h-9 w-9 sm:h-10 sm:w-10 text-red-300 hover:text-white hover:bg-red-500 rounded-full transition-all"><Icon name="LogOut" className="w-[18px] h-[18px] sm:w-5 sm:h-5" /></button>
                      </div>

                      <div className="hidden md:flex items-center">
                          <button onClick={() => setCurrentView('form')} className={`px-4 lg:px-5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex items-center gap-2 ${currentView === 'form' ? 'bg-white text-[#5F259F] shadow-lg scale-105' : 'text-purple-100 hover:text-white'}`}><Icon name="PlusCircle" className="w-4 h-4" /> แจ้งมิเตอร์ชำรุด</button>
                          <button onClick={() => setCurrentView('search')} className={`px-4 lg:px-5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex items-center gap-2 ${currentView === 'search' ? 'bg-white text-[#5F259F] shadow-lg scale-105' : 'text-purple-100 hover:text-white'}`}><Icon name="Search" className="w-4 h-4" /> ตรวจสอบข้อมูล</button>
                          <button onClick={() => setCurrentView('user_dashboard')} className={`px-4 lg:px-5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex items-center gap-2 ${currentView === 'user_dashboard' ? 'bg-white text-[#5F259F] shadow-lg scale-105' : 'text-purple-100 hover:text-white'}`}><Icon name="Grid" className="w-4 h-4" /> รายการแจ้งซ่อม</button>
                          <button onClick={() => setCurrentView('analytics')} className={`px-4 lg:px-5 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex items-center gap-2 ${currentView === 'analytics' ? 'bg-white text-[#5F259F] shadow-lg scale-105' : 'text-purple-100 hover:text-white'}`}><Icon name="Chart" className="w-4 h-4" /> Dashboard</button>
                          <div className="w-[1px] h-6 bg-white/20 mx-1"></div>
                          <div className="px-4 flex items-center gap-2">
                             <div className="w-8 h-8 rounded-full bg-purple-300 flex items-center justify-center text-[#5F259F] font-black">{currentUser?.name ? currentUser.name.charAt(0) : 'U'}</div>
                             <div className="hidden lg:block text-xs font-bold">{currentUser?.name || 'Unknown'}</div>
                          </div>
                          <button onClick={handleLogout} disabled={isExiting} className="px-3 py-2.5 rounded-xl text-xs font-bold transition-all whitespace-nowrap flex items-center gap-2 text-red-300 hover:text-red-100 hover:bg-white/10 disabled:opacity-50"><Icon name="LogOut" className="w-4 h-4" /></button>
                      </div>
                  </nav>
                </div>
              </header>
            )}

            <main className="w-full flex-grow relative overflow-y-auto">
              <div className="max-w-[1400px] w-full mx-auto px-4 pt-3 pb-2">
              {currentView === 'form' && ( 
                <div className="animate-fade-in w-full">
                  <div className="max-w-md mx-auto mb-2 text-center">
                    <h2 className="text-xl lg:text-2xl font-black text-[#5F259F] mb-0">แจ้งมิเตอร์ชำรุด</h2>
                  </div>
                  <div className="max-w-5xl mx-auto w-full">
                    <MeterReportForm jobs={jobs} onSubmit={handleReportSuccess} onViewDashboard={() => setCurrentView(isAdminUser ? 'admin_dashboard' : 'user_dashboard')} currentUser={currentUser} />
                  </div>
                </div> 
              )}
              
              {/* 💡 แก้ไขบรรทัดนี้: ต้องส่ง Props เข้าไปให้ CustomerCheckView ด้วยครับ */}
              {currentView === 'search' && (
                <CustomerCheckView 
                   jobs={jobs} 
                   currentUser={currentUser} 
                   onStatusChange={updateStatus} 
                   onRefresh={() => fetchJobs(true)} 
                />
              )}
              
              {currentView === 'user_dashboard' && !isAdminUser && ( 
                <div className="animate-fade-in w-full h-full">
                  {loading && jobs.length === 0 ? ( <div className="h-96 flex flex-col items-center justify-center gap-4"><div className="w-12 h-12 border-4 border-purple-100 border-t-[#5F259F] rounded-full animate-spin"></div><p className="text-[#5F259F] font-bold text-sm animate-pulse tracking-widest">กำลังดึงข้อมูล...</p></div> ) 
                  : <UserDashboard jobs={jobs} onRefresh={() => fetchJobs(true)} isRefreshing={refreshing || loading} lastUpdated={lastUpdated} currentUser={currentUser} onStatusChange={updateStatus} onDeleteJob={handleDeleteJob} newJobNo={newJobNo} />}
                </div> 
              )}
              
              {isAdminUser && currentView === 'admin_dashboard' && ( loading && jobs.length === 0 ? ( <div className="h-96 flex flex-col items-center justify-center gap-4"><div className="w-12 h-12 border-4 border-purple-100 border-t-[#5F259F] rounded-full animate-spin"></div><p className="text-[#5F259F] font-bold text-sm animate-pulse tracking-widest">กำลังดึงข้อมูลรายการแจ้งซ่อม...</p></div> ) : <AdminDashboard jobs={jobs} onStatusChange={updateStatus} onRefresh={() => fetchJobs(true)} isRefreshing={refreshing || loading} lastUpdated={lastUpdated} currentUser={currentUser} onDeleteJob={handleDeleteJob} newJobNo={newJobNo} /> )}
              {isAdminUser && currentView === 'history' && <HistoryDashboard />}
              {isAdminUser && currentView === 'database' && <DatabaseManager currentUser={currentUser} />}
              {currentView === 'analytics' && ( loading && jobs.length === 0 ? ( <div className="h-96 flex flex-col items-center justify-center gap-4"><div className="w-12 h-12 border-4 border-purple-100 border-t-[#5F259F] rounded-full animate-spin"></div><p className="text-[#5F259F] font-bold text-sm animate-pulse tracking-widest">กำลังคำนวณสถิติ...</p></div> ) : <AnalyticsDashboard jobs={jobs} /> )}
              </div>
            </main>

            <footer className="text-center py-4 text-gray-600 text-[8px] uppercase tracking-[0.2em] bg-gray-100 border-t border-gray-200 w-full mt-auto">
              © 2026 FAST TRACK PEA KPN ©
            </footer>

            {/* 🍞 Toast แจ้งเตือนบันทึกสำเร็จ (เด้งขึ้นจากด้านล่าง) */}
            {toastMsg && ReactDOM.createPortal(
              <div className="fixed bottom-6 left-0 right-0 w-screen flex justify-center px-4 z-[99999] animate-fade-in-up pointer-events-none">
                <div className="bg-gray-900/60 backdrop-blur-xl text-white pl-3 pr-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3 border border-white/20 ring-1 ring-white/5 max-w-[90vw]">
                  <div className={`${toastType === 'delete' ? 'bg-red-500' : 'bg-green-500'} rounded-full p-1.5 shrink-0`}>
                    <Icon name={toastType === 'delete' ? 'Trash' : 'Check'} className="w-4 h-4 text-white" />
                  </div>
                  <span className="font-bold text-sm">{toastMsg}</span>
                </div>
              </div>,
              document.body
            )}
          </div>
        );
      }

      // ==========================================
      // คอมโพเนนต์ตรวจสอบการ Login ก่อนเข้าใช้งาน
      // ==========================================
      const App = () => {
        const [currentUser, setCurrentUser] = useState(() => {
           const saved = sessionStorage.getItem('authUser');
           return saved ? JSON.parse(saved) : null;
        });

        if (!currentUser) {
           return <LoginScreen onLoginSuccess={(user) => setCurrentUser(user)} />;
        }

        return <MainApp currentUser={currentUser} setCurrentUser={setCurrentUser} />;
      };
      
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
  </body>
</html>
