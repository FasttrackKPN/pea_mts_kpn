    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      body { 
        font-family: 'Prompt', sans-serif;
        background-color: #F8FAFC; 
        min-height: 100vh; 
        overflow-x: hidden; 
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .sortable-th { cursor: pointer; user-select: none; transition: background-color 0.2s; }
      .sortable-th:hover { background-color: #F3E8FF; }
      input:disabled, select:disabled, textarea:disabled { background-color: #F3F4F6; color: #6B7280; cursor: not-allowed; opacity: 0.8; }
      input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; }
      @keyframes errorBlink { 0%, 100% { border-color: inherit; box-shadow: none; } 25%, 75% { border-color: #EF4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.3); } }
      .error-blink { animation: errorBlink 0.4s ease-in-out 2; border-color: #EF4444 !important; }
      @keyframes blob { 0% { transform: translate(0px, 0px) scale(1); } 33% { transform: translate(30px, -50px) scale(1.1); } 66% { transform: translate(-20px, 20px) scale(0.9); } 100% { transform: translate(0px, 0px) scale(1); } }
      .animate-blob { animation: blob 10s infinite; } 
      .animation-delay-2000 { animation-delay: 2s; } 
      .animation-delay-4000 { animation-delay: 4s; }
      .animate-fade-in-up { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
      .custom-checkbox { accent-color: #722a96; width: 1.25rem; height: 1.25rem; cursor: pointer; }
      @keyframes highlightRow { 0%, 100% { background-color: transparent; } 50% { background-color: rgba(255, 201, 14, 0.45); } }
      .highlight-new-row { animation: highlightRow 1s ease-in-out 3; }
    </style>

  <body class="text-gray-800 m-0 p-0 w-full overflow-x-hidden">
    <div id="root" class="w-full min-h-screen"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script type="text/babel">
// 🔴 นำลิงก์ Web App จากสเต็ปที่ 1 มาวางในเครื่องหมายคำพูดด้านล่างนี้
      // ====== เชื่อมต่อ Supabase (แทน Google Apps Script) ======
      const SUPABASE_URL  = "https://pwybtowxbfwbmjthadmk.supabase.co";
      const SUPABASE_ANON = "sb_publishable__xmqC3_5rgIX7hyhpSgz-A_Aymz-TDQ";   // 🔴 วาง anon key (eyJ...) ตรงนี้
      const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

      // URL ปลายทาง Google Apps Script สำหรับ Sync ใบงานลง Google Sheet
      const GSHEET_SYNC_URL = "https://script.google.com/macros/s/AKfycbygBgLdx0yaxLbwV04q4gm_JipXZUNxgzyLZuxHNRl7oFAVudNYY_WrQ7H1pnz60Zu-Dg/exec";

      // 📤 อัปรูป (base64[]) ขึ้น Google Drive ผ่าน Apps Script → คืน URL[]
      // type: 'audit' = รูปปิดงาน, อื่นๆ = รูปแจ้งงาน. ถ้าพลาด/ไม่มีรูป คืน array เดิม (กันงานล่ม)
      async function uploadImagesToDrive(images, jobNo, type){
        try {
          const list = Array.isArray(images) ? images.filter(Boolean) : [];
          if (list.length === 0) return [];
          // ถ้าทุกตัวเป็น URL อยู่แล้ว (http) ไม่ต้องอัปซ้ำ
          if (list.every(u => String(u).startsWith('http'))) return list;
          const res = await fetch(GSHEET_SYNC_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'uploadImages', images: list, jobNo: jobNo || '', type: type || 'report' })
          });
          const json = await res.json();
          if (json && json.success && Array.isArray(json.urls) && json.urls.length > 0) {
            return json.urls;
          }
          return list; // fallback: คืนของเดิม
        } catch (e) {
          return Array.isArray(images) ? images : [];
        }
      }

      // ====== 🔔 แจ้งเตือน Telegram (ผ่าน Apps Script relay) ======
      // escape อักขระพิเศษของ HTML mode (Telegram parse_mode=HTML)
      function tgEscape(v){
        return String(v == null ? '' : v)
          .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      }
      // ดึงรูปแรกจาก field image (คั่นด้วย ||| ) — คืนดิบๆ ทั้ง base64 และ URL (Apps Script จัดการแปลงเอง)
      function tgFirstPhotoUrl(image){
        try {
          const arr = (typeof image === 'string' ? image.split('|||') : (Array.isArray(image) ? image : [])).filter(Boolean);
          return arr.length > 0 ? arr[0] : '';
        } catch(e){ return ''; }
      }
      // ประกอบข้อความรายละเอียดใบงาน (ใช้ร่วมทั้งงานใหม่ + เปลี่ยนสถานะ)
      function tgBuildCaption(head, d, jobNo){
        const j = d || {};
        const lat = j.lat || '', lng = j.lng || '';
        const mapUrl = (lat && lng) ? ('https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng) : '';
        let msg = head + '\n';
        msg += '🧾 เลขที่ใบงาน: <b>' + tgEscape(jobNo || j.jobNo || '-') + '</b>\n';
        msg += '📅 วันเวลา: ' + tgEscape(j.timestamp || '-') + '\n';
        msg += '👤 ผู้แจ้ง: ' + tgEscape(j.reporterName || '-') + '\n';
        msg += '🔢 PEA มิเตอร์: ' + tgEscape(j.meterId || '-') + '\n';
        msg += '📏 ขนาดมิเตอร์: ' + tgEscape(j.meterSize || '-') + '\n';
        msg += '🆔 CA: ' + tgEscape(j.caNo || j.ca || '-') + '\n';
        msg += '🏠 ลูกค้า: ' + tgEscape(j.userName || '-') + '\n';
        msg += '📍 ที่อยู่: ' + tgEscape(j.userAddress || '-') + '\n';
        msg += '🔧 สาเหตุ: ' + tgEscape(j.cause || '-') + '\n';
        msg += '🏢 สายจดหน่วย: ' + tgEscape(j.mru || '-') + '\n';
        msg += '🏷️ หมวดอัตรา: ' + tgEscape(j.rateCategory || '-') + '\n';
        msg += '📝 หมายเหตุ: ' + tgEscape(j.note || '-') + '\n';
        if (lat && lng) {
          msg += '🌐 พิกัด: ' + tgEscape(lat) + ', ' + tgEscape(lng) + '\n';
          msg += '🗺️ แผนที่: ' + mapUrl;
        }
        return msg;
      }
      // ส่งไป Apps Script: มีรูปส่ง notify_photo (Apps Script แปลง base64/URL เป็นไฟล์เอง), ไม่มีก็ notify
      function notifyTelegramJob(head, d, jobNo){
        try {
          const caption = tgBuildCaption(head, d, jobNo);
          const photo = tgFirstPhotoUrl(d && d.image);
          const payload = photo
            ? { action:'notify_photo', photo: photo, caption: caption }
            : { action:'notify', text: caption };
          fetch(GSHEET_SYNC_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
          }).catch(function(){});
        } catch(e){}
      }
      // 🔔 ดึงใบงานเต็มจาก server (มี field ครบ + รูป URL) ตาม jobNo แล้วค่อยยิงแจ้งเตือน
      // fallbackData = ข้อมูลที่มีอยู่แล้วในมือ (ใช้กรณีดึงไม่เจอ/พลาด จะได้ยังแจ้งเตือนได้)
      function notifyTelegramByJobNo(head, jobNo, fallbackData){
        try {
          // หน่วง 1.5 วิ เผื่อ server ประมวลผลรูป/บันทึกข้อมูลเสร็จก่อน (รูปแปลงเป็น URL แล้ว)
          setTimeout(function(){
          sb.rpc('admin_list_jobs').then(({data,error})=>{
            let full = null;
            if (!error && Array.isArray(data)) {
              const row = data.find(r => String(r.job_no) === String(jobNo));
              if (row) full = mapJob(row);
            }
            notifyTelegramJob(head, full || fallbackData || {}, jobNo);
          }).catch(function(){ notifyTelegramJob(head, fallbackData || {}, jobNo); });
          }, 1500);
        } catch(e){ notifyTelegramJob(head, fallbackData || {}, jobNo); }
      }

      // แปลงชื่อ field: ลูกค้า (snake_case -> camelCase ที่ React ใช้)
      function mapCust(c){ return { found:true, meterId:c.pea_id, caNo:c.ca_id, ca:c.ca_id,
        mru:c.mru, sequenceNo:c.sequence_no, rateCategory:c.rate_category,
        meterSize:c.meter_size, installType:c.install_type, name:c.name, address:c.address }; }
      // แปลงชื่อ field: ใบงาน (จาก view vw_admin_jobs)
      function mapJob(j){ return { id:j.id, jobNo:j.job_no, timestamp:j.timestamp, mru:j.mru,
        sequenceNo:j.sequence_no, rateCategory:j.rate_category, meterId:j.pea_id,
        reporterName:j.reporter_name, meterSize:j.device_desc, caNo:j.ca_id, ca:j.ca_id,
        userName:j.cust_name, userAddress:j.cust_address, cause:j.cause, lat:j.lat, lng:j.lng,
        note:j.note, status:j.status, image:j.image, auditLink:j.audit_link, defectReason:j.defect_reason,
        agingDays:j.aging_days, duration:j.duration, updatedAt:j.updated_at }; }

      // 🚀 กล่องจำลอง google.script.run ให้ React ทำงานต่อได้โดยไม่ต้องแก้
      window.google = {
        script: {
          get run() {
            return {
              _onSuccess: null, _onFailure: null,
              withSuccessHandler: function(cb){ this._onSuccess = cb; return this; },
              withFailureHandler: function(cb){ this._onFailure = cb; return this; },
              async _rpc(fn, params, transform){
                const ok=this._onSuccess, fail=this._onFailure;
                try { const { data, error } = await sb.rpc(fn, params);
                  if (error) throw error; ok && ok(transform ? transform(data) : data);
                } catch(e){ fail && fail(e); }
              },
              loginUser: function(u,p){ this._rpc('login_user', {p_username:u, p_password:p}); },
              searchCustomerMulti: function(q){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('search_customers',{p_query:q}).then(({data,error})=>{
                  if(error) return fail && fail(error);
                  const list=(data||[]).map(mapCust);
                  ok && ok({ found:list.length>0, data:list,
                    message:list.length?'':'ไม่พบข้อมูลผู้ใช้ไฟฟ้าในระบบ' });
                }); },
              searchCustomerFull: function(q){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('search_customers',{p_query:q}).then(({data,error})=>{
                  if(error) return fail && fail(error);
                  const f=(data&&data[0])||null;
                  ok && ok(f ? mapCust(f) : { found:false });
                }); },
              // 🚀 ลด Egress: ดึงรายการใบงานแบบเบา (ไม่มี note, รูปเอาแค่ URL แรก)
              //    ถ้าส่ง since มา = ดึงเฉพาะใบที่เปลี่ยนแปลงหลังเวลานั้น (delta sync)
              getAdminJobs: function(since){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('admin_list_jobs_light', { p_since: since || null }).then(({data,error})=>{
                  if(error) return fail && fail(error);
                  ok && ok((data||[]).map(mapJob));
                }); },
              // 🔍 ดึงใบงานเต็ม 1 ใบ (note + รูปครบ) ใช้ตอนเปิดหน้าต่างรายละเอียด
              getJobDetail: function(jobNo){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('get_job_detail', { p_job_no: String(jobNo) }).then(({data,error})=>{
                  if(error) return fail && fail(error);
                  const row = (data && data[0]) || null;
                  ok && ok(row ? mapJob(row) : null);
                }); },
              // 📊 ดึงใบงานเต็มทั้งหมด — ใช้เฉพาะตอน Export Excel / Sync Google Sheet
              getAdminJobsFull: function(){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('admin_list_jobs').then(({data,error})=>{
                  if(error) return fail && fail(error);
                  ok && ok((data||[]).map(mapJob));
                }); },
              createJob: function(d,user){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('create_job', {p_data:d, p_user:user}).then(({data,error})=>{
                  if(error) return fail && fail(error);
                  // 🔔 แจ้งเตือน Telegram งานใหม่ — ดึงใบงานเต็มจาก server ก่อน (ได้ field ครบ + รูป URL)
                  try {
                    const jobNo = (data && (data.jobNo || data.job_no)) || (d && d.jobNo) || '';
                    notifyTelegramByJobNo('⚠️ แจ้งเตือน: งานใหม่ (มิเตอร์ชำรุด)', jobNo, d);
                  } catch(e){}
                  ok && ok(data);
                });
              },
              updateJobDetails: function(id,d,user){ this._rpc('update_job', {p_job_no:id, p_data:d, p_user:user}); },
              updateAdminJobStatus: function(id,st,dur,d,u){
                // แยกข้อมูลใบงานเต็ม (_jobFull) ออกก่อน ไม่ให้ปนเข้า RPC
                const src = Object.assign({}, d||{});
                delete src._jobFull;
                const payload = Object.assign({}, src, st?{status:st}:{});
                this._rpc('update_job', {p_job_no:id, p_data:payload, p_user:u});
              },
              deleteJob: function(id,user){ this._rpc('delete_job', {p_job_no:id, p_user:user}); },
              getLogs: function(){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('admin_list_logs')
                  .then(({data,error})=>{ if(error) return fail && fail(error);
                    ok && ok((data||[]).map(r=>{ var rest=(r.details||'')
                      .replace(/(?:Edited\s+)?(?:Job ID|No)[:\s]+\d+/g,'')
                      .replace(/เปลี่ยนสถานะ[^|]*/g,'')
                      .replace(/(?:Status|สถานะ)\s*[:：][^|]*/g,'')
                      .replace(/\|?\s*ผู้ทำรายการ:.*$/,'')
                      .replace(/\bin\s+ชีต\d+/g,'').replace(/[|]/g,' ').replace(/\s+/g,' ').trim();
                      return { timestamp: new Date(r.created_at).toLocaleString('th-TH',{timeZone:'Asia/Bangkok',day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}),
                      action:r.action, jobNo:r.job_id||'', status:r.status||'', details:rest, user:r.username||'' }; })); }); },
              getUniqueOptions: function(){
                const ok=this._onSuccess;
                sb.rpc('get_unique_options').then(({data,error})=>{
                  if(error||!data) return ok && ok({causes:[], reasons:[]});
                  ok && ok({causes:data.causes||[], reasons:data.reasons||[]});
                }); },
              adminListUsers: function(){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('admin_list_users').then(({data,error})=>{
                  if(error) return fail && fail(error);
                  ok && ok(data||[]);
                }); },
              adminCreateUser: function(u,p,fn,act,roles){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('admin_create_user',{p_username:u,p_password:p,p_full_name:fn,p_is_active:act,p_roles:roles}).then(({data,error})=>{
                  if(error) return fail && fail(error); ok && ok(data);
                }); },
              adminUpdateUser: function(u,p,fn,act,roles){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('admin_update_user',{p_username:u,p_password:p,p_full_name:fn,p_is_active:act,p_roles:roles}).then(({data,error})=>{
                  if(error) return fail && fail(error); ok && ok(data);
                }); },
              adminDeleteUser: function(u){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('admin_delete_user',{p_username:u}).then(({data,error})=>{
                  if(error) return fail && fail(error); ok && ok(data);
                }); },
              adminListRoles: function(){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('admin_list_roles').then(({data,error})=>{
                  if(error) return fail && fail(error); ok && ok(data||[]);
                }); },
              adminUpdateRole: function(code,label){
                const ok=this._onSuccess, fail=this._onFailure;
                sb.rpc('admin_update_role',{p_code:code,p_label:label}).then(({data,error})=>{
                  if(error) return fail && fail(error); ok && ok(data);
                }); },
              // 🚀 ลด Egress: ดึงลูกค้าทีละหน้า + ค้นหาที่ฝั่ง server (ไม่ดึงทั้งตารางมาแล้วค่อยกรอง)
              adminListCustomers: async function(limit, offset, search){
                const ok=this._onSuccess, fail=this._onFailure;
                try {
                  const { data, error } = await sb.rpc('admin_list_customers_page', {
                    p_limit: limit || 500, p_offset: offset || 0, p_search: search || ''
                  });
                  if (error) throw error;
                  const rows = data || [];
                  ok && ok({ rows: rows, total: rows.length > 0 ? Number(rows[0].total_count || 0) : 0 });
                } catch(e){ fail && fail(e); }
              },
              // 🚀 ลด Egress: ดึงมิเตอร์ทีละหน้า + ค้นหาที่ฝั่ง server
              adminListMeters: async function(limit, offset, search){
                const ok=this._onSuccess, fail=this._onFailure;
                try {
                  const { data, error } = await sb.rpc('admin_list_meters_page', {
                    p_limit: limit || 500, p_offset: offset || 0, p_search: search || ''
                  });
                  if (error) throw error;
                  const rows = data || [];
                  ok && ok({ rows: rows, total: rows.length > 0 ? Number(rows[0].total_count || 0) : 0 });
                } catch(e){ fail && fail(e); }
              },
              // 🚀 ดึงเฉพาะคีย์ไว้เช็คซ้ำตอน Import (เบากว่าดึงทั้งตารางมาก)
              adminListKeys: async function(kind){
                const ok=this._onSuccess, fail=this._onFailure;
                try {
                  const fn = kind === 'meters' ? 'admin_list_meter_keys' : 'admin_list_customer_keys';
                  const { data, error } = await sb.rpc(fn);
                  if (error) throw error;
                  ok && ok(data || []);
                } catch(e){ fail && fail(e); }
              },
              getEmployees: function(){ const ok=this._onSuccess; ok && ok([]); },
              getScriptUrl: function(){ const ok=this._onSuccess; ok && ok(window.location.origin + '/print.html'); }
            };
          }
        }
      };

      const { useState, useEffect, useMemo, useCallback, useRef } = React;

      // ==========================================
      // ระบบจัดการสิทธิ์แบบ Multi-Role 
      // ==========================================
      const getUserRoles = (user) => {
        if (!user) return [];
        if (Array.isArray(user.roles)) return user.roles;
        if (typeof user.role === 'string') return user.role.split(',').map(r => r.trim());
        return [];
      };

      const canUserEditCoreData = (user, currentStatus) => {
        const roles = getUserRoles(user);
        if (roles.includes('Admin')) return true; 
        if (currentStatus === 'ยกเลิก' || currentStatus === 'ปิดงาน (TECO)') return false;
        if (roles.includes('Coordinator')) return true; 
        if (roles.includes('Employee') && currentStatus === 'งานใหม่') return true; 
        return false; 
      };

      const canUserDelete = (user, currentStatus) => {
        const roles = getUserRoles(user);
        if (roles.includes('Admin')) return true;
        if (currentStatus === 'ยกเลิก' || currentStatus === 'ปิดงาน (TECO)') return false;
        if (roles.includes('Coordinator')) return true;
        if (roles.includes('Employee') && currentStatus === 'งานใหม่') return true;
        return false;
      };

      const canUserPrint = (user) => {
        const roles = getUserRoles(user);
        if (roles.includes('Admin')) return true;
        if (roles.includes('Coordinator') || roles.includes('Approver')) return true; 
        return false; 
      };

      const canUserCancel = (user, currentStatus) => {
        const roles = getUserRoles(user);
        // 🔴 ปรับใหม่: เฉพาะ Admin หรือ Coordinator เท่านั้นที่มีสิทธิ์ยกเลิก
        if (!roles.includes('Admin') && !roles.includes('Coordinator')) return false;

      const parseDate = (dateStr) => {
        if (!dateStr || dateStr === '-') return null;
        try {
          const cleanStr = String(dateStr).trim();
          
          if (cleanStr.includes('T') && cleanStr.includes('Z')) {
             const fallback = new Date(cleanStr); 
             if (!isNaN(fallback.getTime())) return fallback;
          }
          
          if (cleanStr.includes('/')) {
            const parts = cleanStr.split(/[\s,]+/); 
            const dateParts = parts[0].split('/');
            let day = parseInt(dateParts[0], 10); 
            let month = parseInt(dateParts[1], 10) - 1; 
            let year = parseInt(dateParts[2], 10);
            
            if (isNaN(day) || isNaN(month) || isNaN(year)) return null;
            if (year < 100) year += 2000; if (year > 2500) year -= 543; 
            
            let hours = 0; let minutes = 0;
            if (parts[1]) { 
              const timeParts = parts[1].split(':'); 
              if (timeParts.length >= 2) { 
                hours = parseInt(timeParts[0], 10); 
                minutes = parseInt(timeParts[1], 10); 
              } 
            }
            const parsed = new Date(year, month, day, hours, minutes);
            return isNaN(parsed.getTime()) ? null : parsed;
          }
          const fallback = new Date(cleanStr); 
          return isNaN(fallback.getTime()) ? null : fallback;
        } catch (e) { return null; }
      };

// 🚀 ฟังก์ชันสำหรับตัดคำให้เหลือแค่ "วัน" เพื่อไปโชว์หน้าจอ
        const formatShowDays = (durationStr) => {
          if (!durationStr) return '-';
          // ค้นหาตัวเลขที่อยู่ข้างหน้าคำว่า "วัน"
          const match = durationStr.match(/(\d+)\s*วัน/);
          if (match) {
            return `${match[1]} วัน`;
          }
          // ถ้าไม่มีคำว่าวัน แสดงว่าเป็นงานที่เพิ่งแจ้งไม่ถึง 24 ชม. ให้โชว์ 0 วัน
          return '0 วัน';
        };

      const calculateTimeElapsed = (startDateStr) => {
        if (!startDateStr) return '-';
        const start = parseDate(startDateStr); if (!start) return '-';
        const diff = new Date() - start;
        if (diff < 0) return '0 นาที';
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        let result = '';
        if (days > 0) result += `${days} วัน `; if (hours > 0) result += `${hours} ชม. `;
        if (minutes > 0 || result === '') result += `${minutes} นาที`; return result;
      };

      const formatDate = (timestamp) => {
        if (!timestamp) return '-';
        try { 
            const d = new Date(timestamp);
            if (isNaN(d.getTime())) return timestamp; 
            return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}, ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
        } catch (e) { return '-'; }
      };

        if (driveMatch && driveMatch[1]) {
           // ใช้ลิงก์ lh3 ตัวใหม่ที่ทำงานได้ 100% (ใส่เครื่องหมาย $ ให้ถูกต้อง)
           return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`; 
        }
        return url;
      };

      const compressImage = (base64Str, maxWidth = 1000, quality = 0.7) => {
        return new Promise((resolve) => {
            const img = new Image(); img.src = base64Str;
            img.onload = () => {
                const canvas = document.createElement('canvas'); let width = img.width; let height = img.height;
                if (width > height) { if (width > maxWidth) { height = Math.round((height * maxWidth) / width); width = maxWidth; } } 
                else { if (height > maxWidth) { width = Math.round((width * maxWidth) / height); height = maxWidth; } }
                canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            }; img.onerror = () => resolve(base64Str); 
        });
      };

      const LoginScreen = ({ onLoginSuccess }) => {
        const [username, setUsername] = useState('');
        const [password, setPassword] = useState('');
        const [rememberMe, setRememberMe] = useState(true);
        const [showPassword, setShowPassword] = useState(false);
        const [isLoading, setIsLoading] = useState(false);
        const [errorMsg, setErrorMsg] = useState('');

        const handleLogin = (e) => {
          e.preventDefault();
          setErrorMsg(''); 
          
          if (!username.trim() || !password.trim()) {
            setErrorMsg('กรุณากรอกชื่อผู้ใช้งานและรหัสผ่านให้ครบถ้วน');
            return;
          }

          setIsLoading(true);
          if (typeof google !== 'undefined' && google.script) {
            google.script.run
              .withSuccessHandler(res => {
                if (res.success) {
                  if (rememberMe) sessionStorage.setItem('authUser', JSON.stringify(res.user));
                  onLoginSuccess(res.user); 
                } else {
                  setIsLoading(false); setErrorMsg(res.message);
                }
              })
              .withFailureHandler(err => { setIsLoading(false); setErrorMsg('Error: ' + err.message); })
              .loginUser(username, password);
          } else {
            // Local fallback สำหรับตอนรันแบบไม่ต่อ AppScript
            setTimeout(() => {
              setIsLoading(false);
              let mockUser = null;
              if (username === 'admin') mockUser = { username: 'admin', name: 'ขวัญชัย (Local)', role: 'Admin', roles: ['Admin'] };
              else if (username === 'emp') mockUser = { username: 'emp', name: 'พนักงาน (Local)', role: 'Employee', roles: ['Employee'] };
              else if (username === 'approver') mockUser = { username: 'approver', name: 'สิทธิชัย (Local)', role: 'Approver', roles: ['Approver', 'Coordinator'] };
              
              if (mockUser) {
                 if (rememberMe) sessionStorage.setItem('authUser', JSON.stringify(mockUser));
                 onLoginSuccess(mockUser);
              } else setErrorMsg('ไม่พบข้อมูลผู้ใช้นี้ในระบบ');
            }, 1000);
          }
        };

        return (
          <div className="min-h-screen flex items-center justify-center relative px-4 py-10 w-full overflow-hidden bg-[#F4F2F8]">
            <div className="fixed top-[0%] left-[10%] w-72 md:w-96 h-72 md:h-96 bg-purple-300/40 rounded-full mix-blend-multiply filter blur-[60px] animate-blob z-0"></div>

            <div className="bg-white/95 backdrop-blur-xl rounded-[2rem] shadow-2xl w-full max-w-[360px] p-6 sm:p-8 relative z-10 border border-white/50 animate-fade-in-up">
              <div className="text-center mb-8 w-full">
                <div className="w-[80px] h-[80px] bg-gradient-to-br from-[#722a96] to-[#5F259F] rounded-[1.5rem] flex items-center justify-center mx-auto mb-6 shadow-[0_10px_25px_-5px_rgba(95,37,159,0.5)] transform -rotate-0 hover:rotate-0 hover:scale-105 transition-all duration-300">
                  <Icon name="Zap" className="w-10 h-10 text-white" />
                </div>
                <h1 className="text-[22px] sm:text-2xl md:text-3xl font-black tracking-tight leading-none mb-3 whitespace-nowrap"><span className="text-gray-800">PEA</span> <span className="text-[#722a96]">MTS</span></h1>
                <div className="inline-block px-3 py-1 bg-purple-50 rounded-full"><p className="text-[#722a96] text-[10px] font-bold uppercase tracking-[0.2em]">Meter Tracking System</p></div>
              </div>

              <form onSubmit={handleLogin} className="space-y-5">
                <div>
                  <label className="text-[14px] font-extrabold text-gray-600 mb-2 block ml-1">ชื่อผู้ใช้งาน (Username)</label>
                  <div className="relative group">
                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-[#8B5CF6] transition-colors"><Icon name="User" className="w-5 h-5" /></div>
                    <input type="text" value={username} onChange={(e) => setUsername(e.target.value)} className="w-full pl-12 pr-4 py-4 bg-[#F8FAFC] border border-gray-200 rounded-2xl focus:bg-white focus:border-[#8B5CF6] focus:ring-4 focus:ring-[#8B5CF6]/10 outline-none text-gray-800 font-medium transition-all" placeholder="พิมพ์ชื่อผู้ใช้งาน..." />
                  </div>
                </div>

                <div>
                  <label className="text-[14px] font-extrabold text-gray-600 mb-2 block ml-1">รหัสผ่าน (Password)</label>
                  <div className="relative group">
                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-gray-400 group-focus-within:text-[#8B5CF6] transition-colors"><Icon name="Lock" className="w-5 h-5" /></div>
                    <input type={showPassword ? "text" : "password"} value={password} onChange={(e) => setPassword(e.target.value)} className="w-full pl-12 pr-12 py-4 bg-[#F8FAFC] border border-gray-200 rounded-2xl focus:bg-white focus:border-[#8B5CF6] focus:ring-4 focus:ring-[#8B5CF6]/10 outline-none text-gray-800 font-medium transition-all text-lg tracking-widest placeholder:tracking-normal" placeholder="••••••••" />
                    <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute inset-y-0 right-0 pr-4 flex items-center text-gray-400 hover:text-gray-600 focus:outline-none transition-colors"><Icon name={showPassword ? "EyeOff" : "Eye"} className="w-5 h-5" /></button>
                  </div>
                </div>

                <div className="flex items-center mt-2 ml-1">
                  <input type="checkbox" id="remember" checked={rememberMe} onChange={(e) => setRememberMe(e.target.checked)} className="custom-checkbox rounded text-[#8B5CF6] focus:ring-[#8B5CF6] border-gray-300" />
                  <label htmlFor="remember" className="ml-2.5 text-sm font-bold text-gray-600 cursor-pointer select-none">จดจำการเข้าสู่ระบบ</label>
                </div>

                {errorMsg && ( <div className="p-3.5 bg-red-50 text-red-500 text-[13px] font-bold rounded-2xl border border-red-100 flex items-center justify-center gap-2 animate-fade-in text-center"><span className="truncate">{errorMsg}</span></div> )}

                <button type="submit" disabled={isLoading} className="w-full bg-[#722a96] hover:bg-[#87246a] text-white font-bold py-4 rounded-2xl shadow-[0_8px_20px_-6px_rgba(139,92,246,0.4)] hover:shadow-[0_12px_25px_-6px_rgba(139,92,246,0.5)] active:scale-[0.98] transition-all flex items-center justify-center gap-2 text-[17px] mt-6 disabled:opacity-70 disabled:cursor-not-allowed">
                  {isLoading ? <><Icon name="Loader" className="w-5 h-5 animate-spin" /> กำลังตรวจสอบ...</> : <>เข้าสู่ระบบ</>}
                </button>
              </form>
            </div>
            <div className="absolute bottom-6 w-full text-center z-10"><p className="text-[9px] md:text-[10px] font-bold text-gray-400 uppercase tracking-[0.2em]">© 2026 FAST TRACK PEA KPN ©</p></div>
          </div>
        );
      };

      // ==========================================
      // ย่อยส่วนประกอบต่างๆ ของแอปหลัก
      // ==========================================
      const CustomerCheckView = ({ jobs = [], currentUser, onStatusChange, onRefresh }) => {
        const [query, setQuery] = useState(() => sessionStorage.getItem('chkQuery') || '');
        const [resultsList, setResultsList] = useState(() => { const saved = sessionStorage.getItem('chkResults'); return saved ? JSON.parse(saved) : []; }); 
        const [expandedIndex, setExpandedIndex] = useState(() => { const saved = sessionStorage.getItem('chkExpanded'); return saved && saved !== 'undefined' ? JSON.parse(saved) : null; }); 
        const [currentPage, setCurrentPage] = useState(() => { const saved = sessionStorage.getItem('chkPage'); return saved ? parseInt(saved, 10) : 1; }); 
        const itemsPerPage = 50; 
        const [loading, setLoading] = useState(false); const [error, setError] = useState(''); const [copied, setCopied] = useState('');

        // 💡 State สำหรับ Pop-up ปิดงาน (TECO)
        const [tecoModalJob, setTecoModalJob] = useState(null); // เก็บข้อมูลใบงานที่จะปิด
        const [auditImages, setAuditImages] = useState([]);
        const [isSubmittingTECO, setIsSubmittingTECO] = useState(false);
        const [editingJob, setEditingJob] = useState(null); // 🔴 เพิ่มตัวแปรนี้ ไม่งั้นกดยกเลิกแล้วหน้าจะขาว

        // 💡 เช็คสิทธิ์ Audit
        const roles = getUserRoles(currentUser);
        const canAuditTECO = roles.includes('Audit') || roles.includes('Admin');

        useEffect(() => { sessionStorage.setItem('chkQuery', query); sessionStorage.setItem('chkResults', JSON.stringify(resultsList)); sessionStorage.setItem('chkExpanded', JSON.stringify(expandedIndex)); sessionStorage.setItem('chkPage', currentPage); }, [query, resultsList, expandedIndex, currentPage]);
        
        // เคลียร์ค่าเมื่อเปลี่ยนแถบ
        useEffect(() => { setAuditImages([]); setIsSubmittingTECO(false); setTecoModalJob(null); }, [expandedIndex]);

        const copyToClipboard = (text, type) => { navigator.clipboard.writeText(text); setCopied(type); setTimeout(() => setCopied(''), 2000); };

        const handleSearch = (e) => {
          e.preventDefault(); if (!query.trim()) return;
          setLoading(true); setError(''); setResultsList([]); setExpandedIndex(null); setCurrentPage(1); 
          if (typeof google !== 'undefined' && google.script) {
             google.script.run.withSuccessHandler(res => { setLoading(false); if (res.found && res.data && res.data.length > 0) { setResultsList(res.data); if (res.data.length === 1) setExpandedIndex(0); } else { setError(res.message || 'ไม่พบข้อมูลในระบบ'); } }).withFailureHandler((err) => { setLoading(false); setError('เกิดข้อผิดพลาด: ' + err.message); }).searchCustomerMulti(query); 
          } else { setTimeout(() => { setLoading(false); setError('ไม่พบข้อมูลผู้ใช้ไฟฟ้าในระบบ'); }, 800); }
        };

        // 💡 ฟังก์ชันบันทึกปิดงานผ่าน Pop-up
        const handleCloseJob = () => {
           if (!tecoModalJob) return;
           if (auditImages.length === 0) {
              alert('กรุณาแนบรูปถ่ายหรือไฟล์หลักฐานอย่างน้อย 1 รูป เพื่อยืนยันการปิดงาน (TECO)');
              return;
           }
           
           // เก็บค่าเอาไว้ก่อนเคลียร์หน้าจอ
           const jobId = tecoModalJob.id;
           const currentImages = [...auditImages];

           // 🚀 1. ปิด Popup ทันที และเคลียร์ค่าบนหน้าต่าง
           setTecoModalJob(null); 
           setExpandedIndex(null); 
           setAuditImages([]);
           
           // เปลี่ยนสถานะบนตารางเป็น "ปิดงาน (TECO)" ให้เห็นทันที (Optimistic)
           onStatusChange(jobId, 'ปิดงาน (TECO)', { auditLink: currentImages.join('|||') }, 'optimistic');

           // 🚀 2. นำรูปไปบีบอัดและส่งไปเซฟหลังบ้านแบบทำงานเบื้องหลัง (ไม่บล็อกหน้าจอ)
           Promise.all(
             currentImages.map(img => img.startsWith('data:image') || img.startsWith('data:application/pdf') ? compressImage(img) : img)
           ).then(async processedImages => {
             // 📤 อัปรูปปิดงานขึ้น Google Drive (โฟลเดอร์ audit) เก็บเป็น URL แทน base64
             processedImages = await uploadImagesToDrive(processedImages, jobId, 'audit');
             // ส่งข้อมูลไปเซฟที่ Google Sheets และ Drive
             onStatusChange(jobId, 'ปิดงาน (TECO)', { 
               auditLink: processedImages.join('|||'),
               auditImages: processedImages 
             });
           }).catch(err => {
             console.error('เกิดข้อผิดพลาดในการประมวลผลรูปภาพ:', err);
           });
        };

        const formatData = (val) => { const str = String(val || '').trim(); if (!str || str === '-' || str.toUpperCase() === '#N/A' || str.toUpperCase() === 'N/A') return <span className="text-gray-400 font-normal text-[14px]">ไม่พบข้อมูล</span>; return str; };
        const totalPages = Math.ceil(resultsList.length / itemsPerPage); const startIndex = (currentPage - 1) * itemsPerPage; const currentItems = resultsList.slice(startIndex, startIndex + itemsPerPage);

        const renderPagination = () => {
          if (totalPages <= 1) return null; const pages = []; let startPage = Math.max(1, currentPage - 2); let endPage = Math.min(totalPages, currentPage + 2);
          if (endPage - startPage < 4) { if (startPage === 1) endPage = Math.min(totalPages, 5); else if (endPage === totalPages) startPage = Math.max(1, totalPages - 4); }
          for (let i = startPage; i <= endPage; i++) { pages.push(<button key={i} onClick={() => { setCurrentPage(i); setExpandedIndex(null); }} className={`w-10 h-10 flex items-center justify-center rounded-xl font-bold transition-all ${currentPage === i ? 'bg-[#5F259F] text-white shadow-md scale-110' : 'bg-white text-purple-600 hover:bg-purple-100 hover:text-[#5F259F] border border-purple-200'}`}>{i}</button>); }
          return (
            <div className="flex flex-col items-center justify-center pt-6 pb-2 space-y-3 border-t border-purple-100 mt-4 animate-fade-in w-full">
              <div className="text-sm font-bold text-gray-500">หน้า {currentPage} จาก {totalPages}</div>
              <div className="flex items-center gap-1.5 sm:gap-2">
                <button onClick={() => { setCurrentPage(prev => Math.max(prev - 1, 1)); setExpandedIndex(null); }} disabled={currentPage === 1} className="w-10 h-10 flex items-center justify-center rounded-xl font-bold bg-white text-purple-600 border border-purple-200 hover:bg-purple-100 hover:text-[#5F259F] transition-all disabled:opacity-50 disabled:bg-gray-50 disabled:text-gray-400 disabled:border-gray-200 shadow-sm"><svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg></button>
                {startPage > 1 && (<><button onClick={() => { setCurrentPage(1); setExpandedIndex(null); }} className="w-10 h-10 hidden sm:flex items-center justify-center rounded-xl font-bold bg-white text-purple-600 border border-purple-200 hover:bg-purple-100 transition-all">1</button>{startPage > 2 && <span className="text-gray-400 hidden sm:block">...</span>}</>)}
                {pages}
                {endPage < totalPages && (<>{endPage < totalPages - 1 && <span className="text-gray-400 hidden sm:block">...</span>}<button onClick={() => { setCurrentPage(totalPages); setExpandedIndex(null); }} className="w-10 h-10 hidden sm:flex items-center justify-center rounded-xl font-bold bg-white text-purple-600 border border-purple-200 hover:bg-purple-100 transition-all">{totalPages}</button></>)}
                <button onClick={() => { setCurrentPage(prev => Math.min(prev + 1, totalPages)); setExpandedIndex(null); }} disabled={currentPage === totalPages} className="w-10 h-10 flex items-center justify-center rounded-xl font-bold bg-white text-purple-600 border border-purple-200 hover:bg-purple-100 hover:text-[#5F259F] transition-all disabled:opacity-50 disabled:bg-gray-50 disabled:text-gray-400 disabled:border-gray-200 shadow-sm"><svg className="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg></button>
              </div>
            </div>
          );
        };

{/* 🔴 เพิ่มเพื่อให้หน้าตรวจสอบข้อมูลรู้จักและเปิดกล่องแก้ไข/ยกเลิกงานได้สำเร็จ */}
            {editingJob && <JobCompletionModal job={editingJob} onClose={() => setEditingJob(null)} onConfirm={(id, d) => { onStatusChange(id, null, d, 'edit'); setEditingJob(null); }} onDelete={() => {}} mode="edit" currentUser={currentUser} />}

            
        return (
          <div className="max-w-4xl w-full mx-auto pb-8 px-4 animate-fade-in relative">
             <div className="text-center mb-6 md:mb-8 mt-4 md:mt-8">
               {resultsList.length === 0 && <div className="inline-block p-4 rounded-full bg-blue-50 mb-4 shadow-inner border border-blue-100 animate-fade-in"><Icon name="Search" className="w-8 h-8 text-blue-600" /></div>}
               <h2 className="text-2xl md:text-3xl font-black text-[#5F259F] tracking-tight">ตรวจสอบข้อมูลผู้ใช้ไฟฟ้า</h2>
             </div>
             <form onSubmit={handleSearch} className="relative mb-8 max-w-2xl mx-auto">
               <div className="relative flex items-center">
                 <Icon name="Search" className="absolute left-4 md:left-5 w-5 h-5 md:w-6 md:h-6 text-gray-400 pointer-events-none" />
                 <input type="text" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="กรอก CA, PEA หรือ ชื่อ-นามสกุล..." className="w-full py-3.5 md:py-4 pl-12 md:pl-14 pr-[100px] md:pr-[130px] bg-white border border-gray-200 rounded-2xl shadow-sm focus:ring-2 focus:ring-[#5F259F] outline-none text-[14px] md:text-lg transition-all" />
                 <button type="submit" disabled={loading || !query} className="absolute right-2 top-2 bottom-2 bg-[#5F259F] text-white px-4 md:px-6 rounded-xl font-bold hover:bg-[#4a1d7c] disabled:opacity-50 disabled:cursor-not-allowed transition-all flex items-center gap-2 text-sm md:text-base shadow-md">{loading ? <Icon name="Loader" className="w-4 h-4 md:w-5 md:h-5 animate-spin" /> : <Icon name="Search" className="w-4 h-4 md:w-5 md:h-5 hidden sm:block" />} <span>ค้นหา</span></button>
               </div>
             </form>
             {error && (<CustomAlert message={error} onClose={() => setError('')} />)}
             
             {resultsList.length > 0 && !loading && (
                <div className="max-w-4xl w-[90%] sm:w-full mx-auto animate-fade-in space-y-4">
                   {resultsList.length > 1 && <div className="text-sm font-bold text-gray-500 mb-3 ml-2 flex items-center gap-2"><div className="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>พบข้อมูลทั้งหมด {resultsList.length} รายการ</div>}
                   {currentItems.map((item, idx) => {
                      const isExpanded = expandedIndex === idx;
                      
                      // 💡 ค้นหาว่ามีใบงานที่เชื่อมโยงกับ CA/PEA นี้ และสถานะ "สับเปลี่ยน SAP แล้ว" หรือไม่?
                      const targetJob = jobs.find(j => 
                         (String(j.meterId).trim() === String(item.meterId).trim() || 
                          String(j.ca).trim() === String(item.ca || item.caNo).trim() || 
                          String(j.caNo).trim() === String(item.ca || item.caNo).trim()) && 
                         getSafeStatus(j.status) === 'สับเปลี่ยน SAP แล้ว'
                      );

                      return (
                        <div key={idx} className={`bg-white rounded-2xl shadow-sm border transition-all duration-300 overflow-hidden ${isExpanded ? 'border-[#5F259F] shadow-md' : 'border-purple-200 hover:border-[#5F259F]'}`}>
                           <div onClick={() => setExpandedIndex(isExpanded ? null : idx)} className={`p-4 md:p-5 cursor-pointer flex justify-between items-center group transition-colors ${isExpanded ? 'bg-purple-100' : 'bg-purple-50'}`}>
                              <div>
                                <div className={`font-bold text-lg md:text-xl mb-2 transition-colors ${isExpanded ? 'text-[#5F259F]' : 'text-[#5F259F]'}`}>{item.name}</div>
                                <div className="flex flex-wrap gap-2 text-xs font-bold">
                                  <span className="text-purple-700 bg-white px-2.5 py-1.5 rounded-lg border border-purple-200 shadow-sm">CA: {item.caNo || item.ca}</span>
                                  <span className="text-amber-700 bg-white px-2.5 py-1.5 rounded-lg border border-amber-200 shadow-sm">PEA: {item.meterId}</span>
                                </div>
                              </div>
                              <div className="flex items-center gap-3">
                                 {/* โชว์ป้ายเตือนถ้ามีงานค้างรอ Audit ปิด */}
                                 {targetJob && !isExpanded && (
                                   <span className="hidden sm:inline-block bg-emerald-100 text-emerald-700 border border-emerald-200 text-[10px] px-2 py-1 rounded-md font-bold animate-pulse">
                                     รอปิดงาน TECO
                                   </span>
                                 )}
                                 <div className={`p-2.5 md:p-3 rounded-full transition-all duration-300 shadow-sm ${isExpanded ? 'bg-[#5F259F] text-white' : 'bg-white text-purple-400 group-hover:bg-[#5F259F] group-hover:text-white'}`}><Icon name="ChevronDown" className={`w-5 h-5 transition-transform duration-300 ${isExpanded ? 'rotate-180' : ''}`} /></div>
                              </div>
                           </div>
                           {isExpanded && (
                              <div className="border-t border-purple-100 bg-white animate-fade-in">
                                 <div className="p-4 md:p-6 space-y-5">
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                       <div className="bg-purple-50 p-4 rounded-xl border border-purple-100">
                                         <label className="text-[12px] md:text-xs text-purple-600 font-bold uppercase tracking-widest block mb-1">หมายเลขผู้ใช้ไฟฟ้า (CA)</label>
                                         <div className="flex items-center justify-between gap-2">
                                           <div className="text-xl md:text-2xl font-black text-purple-900 tracking-tight">{formatData(item.ca || item.caNo)}</div>
                                           {(item.ca || item.caNo) && <button onClick={(e) => { e.stopPropagation(); copyToClipboard(item.ca || item.caNo, `ca-${idx}`); }} className="p-1.5 bg-white/60 hover:bg-white rounded-lg text-purple-500 hover:text-purple-700 transition shadow-sm border border-purple-200/50" title="คัดลอก CA">{copied === `ca-${idx}` ? <Icon name="Check" className="w-4 h-4 text-green-600" /> : <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>}</button>}
                                         </div>
                                       </div>
                                       <div className="bg-amber-50 p-4 rounded-xl border border-amber-200">
                                         <label className="text-[12px] md:text-xs text-amber-700 font-bold uppercase tracking-widest block mb-1">หมายเลขมิเตอร์ (PEA)</label>
                                         <div className="flex items-center justify-between gap-2">
                                           <div className="text-xl md:text-2xl font-black text-amber-900 tracking-tight">{formatData(item.meterId)}</div>
                                           {item.meterId && <button onClick={(e) => { e.stopPropagation(); copyToClipboard(item.meterId, `pea-${idx}`); }} className="p-1.5 bg-white/60 hover:bg-white rounded-lg text-amber-600 hover:text-amber-800 transition shadow-sm border border-amber-200/50" title="คัดลอก PEA">{copied === `pea-${idx}` ? <Icon name="Check" className="w-4 h-4 text-green-600" /> : <svg className="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>}</button>}
                                         </div>
                                       </div>
                                    </div>
                                    <div className="space-y-4">
                                      <div className="border-b border-gray-100 pb-3"><label className="text-[12px] md:text-xs text-gray-400 font-bold uppercase tracking-widest block mb-1">ที่อยู่ / สถานที่ใช้ไฟฟ้า</label><div className="text-sm md:text-base font-medium text-gray-600 leading-relaxed">{formatData(item.address)}</div></div>
                                      <div className="border-b border-gray-100 pb-3"><label className="text-[12px] md:text-xs text-gray-400 font-bold uppercase tracking-widest block mb-1">ประเภทการติดตั้ง</label><div className="text-sm md:text-base font-medium text-gray-600 leading-relaxed">{formatData(item.installType)}</div></div>
                                      <div className="border-b border-gray-100 pb-3"><label className="text-[12px] md:text-xs text-gray-400 font-bold uppercase tracking-widest block mb-1">คำอธิบายหมวดมิเตอร์</label><div className="text-sm md:text-base font-medium text-gray-600 leading-relaxed">{formatData(item.meterSize)}</div></div>
                                      <div className="pb-1"><label className="text-[12px] md:text-xs text-gray-400 font-bold uppercase tracking-widest block mb-1">หน่วยการอ่าน (MRU)</label><div className="text-sm md:text-base font-medium text-gray-600 leading-relaxed">{formatData(item.mru)}</div></div>
                                    </div>

                                    {/* 💡 ปุ่มกดเปิด Pop-up (แสดงเฉพาะเมื่อสิทธิ์ถึงและมีใบงานอ้างอิง) */}
                                    {canAuditTECO && targetJob && (
                                      <div className="mt-6 pt-6 border-t border-gray-100 flex justify-end">
                                        <button 
                                          onClick={(e) => { e.stopPropagation(); setTecoModalJob(targetJob); }}
                                          className="px-6 py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-black rounded-xl shadow-lg shadow-emerald-200 transition-all flex items-center gap-2 active:scale-95 text-sm sm:text-base w-full sm:w-auto justify-center"
                                        >
                                          <Icon name="CheckCircle" className="w-5 h-5" />

      const CustomCombobox = ({ label, value, onChange, options, placeholder, inputRef, className="", labelClassName="text-[11px] text-gray-500 uppercase tracking-wider font-bold block mb-1", disabled=false }) => {

      const EmployeeCombobox = ({ label, value, onChange, options, placeholder, inputRef, className="", labelClassName="text-[11px] text-gray-500 uppercase tracking-wider font-bold block mb-1", disabled=false }) => {

        const handleSelect = (opt) => { setDisplayValue(opt); const parts = opt.trim().split(/\s+/); if (parts.length > 1 && /^\d+$/.test(parts[0])) { onChange(parts.slice(1).join(' ')); } else { onChange(opt); } setIsOpen(false); };

      const MeterReportForm = ({ jobs, onSubmit, onViewDashboard, currentUser }) => {
        const [formData, setFormData] = useState(() => { 
          const saved = sessionStorage.getItem('reportFormData'); 
          const defaultName = currentUser ? currentUser.name : '';
          return saved ? { ...JSON.parse(saved), status: 'งานใหม่', reporterName: defaultName } : { meterId: '', caNo: '', cause: '', defectReason: '', lat: '', lng: '', note: '', reporterName: defaultName, status: 'งานใหม่' }; 
        });
        const [meterSearchStatus, setMeterSearchStatus] = useState(() => formData.meterId ? 'found' : 'idle');
        const [caSearchStatus, setCaSearchStatus] = useState(() => formData.caNo ? 'found' : 'idle');
        const [images, setImages] = useState([]);
        const [status, setStatus] = useState('idle'); const [gpsLoading, setGpsLoading] = useState(false); const [alertMsg, setAlertMsg] = useState(null); const [autoFillingMeter, setAutoFillingMeter] = useState(false);
        const [autoFillingCA, setAutoFillingCA] = useState(false); const [errorField, setErrorField] = useState(null);
        const locationRef = useRef(null); const meterRef = useRef(null);
        const causeRef = useRef(null); const reporterRef = useRef(null); const reasonRef = useRef(null);
        const [fetchedCauses, setFetchedCauses] = useState([]); const [fetchedReasons, setFetchedReasons] = useState([]);
        const [employees, setEmployees] = useState([]);

        useEffect(() => { 
          sessionStorage.setItem('reportFormData', JSON.stringify(formData)); 
        }, [formData]);

        const clearForm = () => { 
  setFormData({ meterId: '', caNo: '', cause: '', defectReason: '', lat: '', lng: '', note: '', reporterName: currentUser ? currentUser.name : '', status: 'งานใหม่', duration: '-' }); // 🚀 ใส่ duration: '-'
  setImages([]); setMeterSearchStatus('idle'); setCaSearchStatus('idle'); sessionStorage.removeItem('reportFormData');
};
        
        useEffect(() => { if (typeof google !== 'undefined' && google.script) { google.script.run.withSuccessHandler(res => { if(res) { setFetchedCauses(res.causes || []); setFetchedReasons(res.reasons || []); } }).getUniqueOptions(); google.script.run.withSuccessHandler(res => { if(res && res.length > 0) setEmployees(res); }).getEmployees(); } }, []);

        const sortedEmployees = useMemo(() => { if (!employees || employees.length === 0) return []; const freqs = {}; if (jobs && jobs.length > 0) { jobs.forEach(j => { const name = String(j.reporterName || '').trim(); if(name && name !== '-') freqs[name] = (freqs[name] || 0) + 1; }); } return [...employees].sort((a, b) => { const partsA = a.trim().split(/\s+/); const partsB = b.trim().split(/\s+/); const nameA = partsA.length > 1 && /^\d+$/.test(partsA[0]) ? partsA.slice(1).join(' ') : a.trim(); const nameB = partsB.length > 1 && /^\d+$/.test(partsB[0]) ? partsB.slice(1).join(' ') : b.trim(); return (freqs[nameB] || 0) - (freqs[nameA] || 0); }); }, [employees, jobs]);
        const sortedCauses = useMemo(() => { const freqs = {}; if (jobs && jobs.length > 0) { jobs.forEach(j => { const val = String(j.cause || '').trim(); if(val && val !== '-') freqs[val] = (freqs[val] || 0) + 1; }); } const combined = [...new Set([...CAUSE_OPTIONS, ...fetchedCauses].map(o => String(o).trim()).filter(Boolean))]; return combined.sort((a, b) => (freqs[b] || 0) - (freqs[a] || 0)); }, [fetchedCauses, jobs]);
        const sortedDefectReasons = useMemo(() => { const freqs = {}; if (jobs && jobs.length > 0) { jobs.forEach(j => { const val = String(j.defectReason || '').trim(); if(val && val !== '-') freqs[val] = (freqs[val] || 0) + 1; }); } const combined = [...new Set([...DEFECT_REASON_OPTIONS, ...fetchedReasons].map(o => String(o).trim()).filter(Boolean))]; return combined.sort((a, b) => (freqs[b] || 0) - (freqs[a] || 0)); }, [fetchedReasons, jobs]);

        const triggerMeterFetch = (mId) => { setAutoFillingMeter(true); setMeterSearchStatus('loading'); if (typeof google !== 'undefined' && google.script) { google.script.run.withSuccessHandler(res => { setAutoFillingMeter(false); if (res.found && (res.caNo || res.ca)) { setFormData(prev => ({ ...prev, caNo: res.caNo || res.ca })); setMeterSearchStatus('found'); setCaSearchStatus('found'); } else { setMeterSearchStatus('not_found'); } }).withFailureHandler(() => { setAutoFillingMeter(false); setMeterSearchStatus('not_found'); }).searchCustomerFull(mId); } else { setTimeout(() => { setAutoFillingMeter(false); setMeterSearchStatus('not_found'); }, 800); } };
        const triggerCAFetch = (ca) => { setAutoFillingCA(true); setCaSearchStatus('loading'); if (typeof google !== 'undefined' && google.script) { google.script.run.withSuccessHandler(res => { setAutoFillingCA(false); if (res.found && res.meterId) { setFormData(prev => ({ ...prev, meterId: res.meterId })); setCaSearchStatus('found'); setMeterSearchStatus('found'); } else { setCaSearchStatus('not_found'); } }).withFailureHandler(() => { setAutoFillingCA(false); setCaSearchStatus('not_found'); }).searchCustomerFull(ca); } else { setTimeout(() => { setAutoFillingCA(false); setCaSearchStatus('not_found'); }, 800); } };

        const handleMeterChange = (e) => { 
          const val = e.target.value.replace(/\D/g, '').slice(0, 10);
          setFormData(prev => ({...prev, meterId: val})); 
          
          if (val.length === 0) { 
            setMeterSearchStatus('idle');
            setCaSearchStatus('idle'); 
          } else { 
            setMeterSearchStatus('idle');
          } 
        };

        const handleCAChange = (e) => { let val = e.target.value.replace(/\D/g, ''); if (val.startsWith('0')) val = val.replace(/^0+/, ''); val = val.slice(0, 11); setFormData(prev => ({...prev, caNo: val})); if (val.length === 0) { setCaSearchStatus('idle'); setMeterSearchStatus('idle'); } else { setCaSearchStatus('idle'); } };

        const getLocation = () => { setGpsLoading(true); if (!navigator.geolocation) { setAlertMsg("อุปกรณ์ของท่านไม่รองรับการระบุพิกัด"); setGpsLoading(false); return; } const handleSuccess = (pos) => { setFormData(prev => ({ ...prev, lat: pos.coords.latitude.toFixed(6), lng: pos.coords.longitude.toFixed(6) })); setGpsLoading(false); }; const handleError = (error) => { navigator.geolocation.getCurrentPosition(handleSuccess, (finalErr) => { 
           let msg = "ไม่สามารถดึงพิกัดได้"; 
           switch(finalErr.code) { 
             case finalErr.PERMISSION_DENIED: 
               msg = "⚠️ เบราว์เซอร์หรือแอปบล็อกการเข้าถึง GPS\n\nวิธีแก้: หากคุณเปิดผ่านแอป LINE หรือฝังในเว็บ ให้กดปุ่ม 'เปิดในเบราว์เซอร์ (Open in Safari/Chrome)' หรืออนุญาต Location ก่อนครับ"; 
               break; 
             case finalErr.POSITION_UNAVAILABLE: 
               msg = "ไม่พบสัญญาณ GPS กรุณาตรวจสอบการตั้งค่ามือถือ"; 
               break; 
             case finalErr.TIMEOUT: 
               msg = "หมดเวลาค้นหาพิกัด สัญญาณอาจอ่อนเกินไป"; 
               break; 
             default: 
               msg = "เกิดข้อผิดพลาด: " + finalErr.message; 
           } 
           setAlertMsg(msg); 
           setGpsLoading(false); 
        }, { enableHighAccuracy: false, timeout: 10000, maximumAge: Infinity }); }; try { navigator.geolocation.getCurrentPosition(handleSuccess, handleError, { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }); } catch (e) { setAlertMsg("Error GPS: " + e.message); setGpsLoading(false); } };

        const showError = (ref, fieldName) => { setErrorField(fieldName); if (ref && ref.current) { setTimeout(() => { try { ref.current.scrollIntoView({ behavior: 'smooth', block: 'center' }); if (ref.current.focus) ref.current.focus(); } catch(e){} }, 60); } setTimeout(() => setErrorField(null), 1000); };

        const handleSubmit = async (e) => { 
          e.preventDefault(); 
          
          // 🔴 ดักจับขั้นเด็ดขาด: ห้ามระบุเหตุผลว่างเปล่า, ห้ามพิมพ์แค่ช่องว่าง หรือขีด (-)
          if (formData.status === 'ยกเลิก') {
             const reasonClean = String(formData.cancelReason || '').trim();
             if (reasonClean === '' || reasonClean === '-') {
                setAlertMsg('⚠️ ไม่สามารถบันทึกได้!\n\nกรุณาระบุเหตุผลในการยกเลิกใบงานนี้ให้ชัดเจน ก่อนทำการกดปุ่มบันทึกข้อมูล');
                return; // หยุดและยกเลิกกระบวนการเซฟทันที
             }
          }
          
          // 💡 2. เช็คเงื่อนไข Audit: ถ้าจะปิดงาน (TECO) ต้องมีรูปปิดงานอย่างน้อย 1 รูป
          
          // 1. เช็คข้อมูลบังคับกรอก
          if (!formData.lat || !formData.lng) { if (locationRef) showError(locationRef, 'location'); return; } 
          if (!formData.meterId) { if (meterRef) showError(meterRef, 'meterId'); return; } 
          if (!formData.cause) { if (causeRef) showError(causeRef, 'cause'); return; } 
          if (!formData.defectReason) { showError(reasonRef, 'defectReason'); return; } 
          if (!formData.reporterName) { if (reporterRef) showError(reporterRef, 'reporterName'); return; } 
          
          // 2. ตรวจสอบงานซ้ำหน้าบ้าน (แก้ไขบั๊ก getSafeStatus ที่ทำให้ปุ่มนิ่ง)
          if (typeof jobs !== 'undefined' && jobs && jobs.length > 0) {
             const duplicateJob = jobs.find(j => {
                const currentStatus = j.status ? String(j.status).trim() : '';
                return String(j.meterId).trim() === String(formData.meterId).trim() && 
                       currentStatus !== 'ปิดงาน (TECO)' &&

             });
             if (duplicateJob) {

                return; 
             }
          }

            // 🚀 แจ้งหน้าหลักให้โชว์ toast + เด้งไปหน้ารายการแจ้งซ่อมทันที
          sessionStorage.removeItem('reportFormData');
          if (typeof onSubmit === 'function') onSubmit();
          
          try {
            // 🚀 4. ระบบจะแอบทำการเตรียมรูปภาพเบื้องหลัง (เผื่อรูปใหญ่เกินกว่าที่ Google จะรับไหว)
            let processedImages = typeof images !== 'undefined' ? images : [];
            if (typeof compressImage === 'function' && processedImages.length > 0) {
               // แอบบีบอัดเบื้องหลังเพื่อรับประกันว่า "เซฟลง Sheets 100%"
               processedImages = await Promise.all(processedImages.map(img => compressImage(img)));
            }

            // 📤 อัปรูปแจ้งงานขึ้น Google Drive แล้วเก็บเป็น URL แทน base64 (ประหยัดพื้นที่ DB + ให้ LINE/Telegram โชว์รูปได้)
            if (processedImages.length > 0) {
              processedImages = await uploadImagesToDrive(processedImages, formData.jobNo, 'report');
            }

            const finalDataToSubmit = { ...formData, image: processedImages, status: 'งานใหม่' };
            
            // 🚀 5. ทำงานส่งข้อมูลอยู่เบื้องหลังเงียบๆ
            if (typeof google !== 'undefined' && google.script) { 
              google.script.run
                .withSuccessHandler(res => { 
                  if (res && res.duplicate) { 
                    console.warn(res.message);

                    if (res && res.jobNo && typeof onSubmit === 'function') onSubmit(res.jobNo);
