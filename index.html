                      <th onClick={() => requestSort('userName')} className="sortable-th px-3 py-4 text-xs whitespace-nowrap font-bold text-black uppercase tracking-widest max-w-[150px] bg-[#F3E8FF]">ชื่อ-นามสกุล {renderSortIcon('userName')}</th>
                      <th onClick={() => requestSort('cause')} className="sortable-th px-3 py-4 text-xs whitespace-nowrap font-bold text-black uppercase tracking-widest max-w-[150px] bg-[#F3E8FF]">สาเหตุชำรุด {renderSortIcon('cause')}</th>
                      <th className="px-3 py-4 text-xs whitespace-nowrap font-bold text-black uppercase tracking-widest text-center bg-[#F3E8FF]">รูปภาพ</th>
                      <th className="px-3 py-4 text-xs whitespace-nowrap font-bold text-black uppercase tracking-widest text-center bg-[#F3E8FF]">พิกัด</th>
                      <th onClick={() => requestSort('status')} className="sortable-th px-3 py-4 text-xs whitespace-nowrap font-bold text-black uppercase tracking-widest text-center bg-[#F3E8FF]">สถานะงาน {renderSortIcon('status')}</th>
                      <th className="px-3 py-4 text-xs whitespace-nowrap font-bold text-black uppercase tracking-widest text-center bg-[#F3E8FF]">จัดการ</th>
                    </tr>
                  </thead>
                  </table>
                </div>
                {/* เนื้อหาตาราง (เลื่อนได้ scrollbar อยู่ใต้หัว) */}
                <div onScroll={e => { const h = document.getElementById('jobHead'); if (h) h.scrollLeft = e.target.scrollLeft; }} className="overflow-x-auto overflow-y-auto h-[calc(100vh-300px)]">
                  <table className="w-full text-left border-collapse min-w-[1200px] table-fixed">
                    <colgroup><col style={{width:'110px'}}/><col style={{width:'150px'}}/><col style={{width:'160px'}}/><col style={{width:'150px'}}/><col style={{width:'160px'}}/><col style={{width:'150px'}}/><col style={{width:'90px'}}/><col style={{width:'110px'}}/><col style={{width:'150px'}}/><col style={{width:'80px'}}/></colgroup>
                  <tbody className="divide-y divide-gray-50">
                    {processedJobs.length > 0 ? processedJobs.map(job => {
                      const statusStr = getSafeStatus(job.status); const statusConfig = STATUS_OPTIONS[statusStr] || STATUS_OPTIONS['งานใหม่']; const isCancelled = statusStr === 'ยกเลิก'; 
                      const availableStatuses = getAvailableStatuses(currentUser, statusStr); 
                      const tableStatuses = availableStatuses.filter(s => s !== 'ยกเลิก' || statusStr === 'ยกเลิก');
                      const isStatusDisabled = tableStatuses.length <= 1;
                      
                      // 💡 ฟังก์ชันสร้างป้ายเตือนแบบฉลาด (Desktop)
                      const renderDesktopAgingBadge = () => {
                        if (statusStr === 'ปิดงาน (TECO)') {
                          const showDuration = job.duration && job.duration !== '-' && !String(job.duration).includes("NaN");
                          return (
                             <div className="mt-1 inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold border shadow-sm bg-green-50 text-green-700 border-green-200">
                               จบงาน {formatShowDays(job.duration ? job.duration : calculateTimeElapsed(job.timestamp))}
                             </div>
                          );
                        }
                        
                        const days = (!isNaN(Number(job.agingDays)) && job.agingDays !== '') ? Number(job.agingDays) : 0;
                        return (
                          <div className={`mt-1 inline-flex items-center px-1.5 py-0.5 rounded text-[10px] font-bold border shadow-sm ${
                            days <= 3 ? 'bg-yellow-50 text-yellow-700 border-yellow-200' : 
                            days <= 7 ? 'bg-orange-50 text-orange-700 border-orange-200' : 'bg-red-50 text-red-700 border-red-200' 
                          }`}>
                            <span className={`w-1.5 h-1.5 rounded-full mr-1 animate-pulse ${
                              days <= 3 ? 'bg-yellow-500' : days <= 7 ? 'bg-orange-500' : 'bg-red-500'
                            }`}></span>
                            ค้าง {days} วัน
                          </div>
                        );
                      };

                      return (
                      <tr key={job.id} onClick={() => setEditingJob(job)} className={`transition-colors text-xs cursor-pointer group ${String(job.jobNo) === String(newJobNo) ? 'highlight-new-row' : ''} ${isCancelled ? 'bg-gray-100 opacity-50 grayscale' : 'hover:bg-purple-100/60'}`} title={canUserEditCoreData(currentUser, job.status) ? "คลิกเพื่อดูและแก้ไขข้อมูล" : "คลิกเพื่อดูรายละเอียดข้อมูล"}>
                        <td className="px-3 py-2 align-middle whitespace-nowrap">
                          <div className="font-bold text-[#5F259F]">{job.jobNo}</div>
                          {renderDesktopAgingBadge()}
                        </td>
                        <td className="px-3 py-2 align-middle whitespace-nowrap"><div className="font-medium text-gray-800">{formatDate(job.timestamp)}</div>{job.reporterName && <div className="text-[10px] text-gray-500 mt-0.5">แจ้งโดย {job.reporterName}</div>}</td>
                        <td className="px-3 py-2 align-middle whitespace-nowrap">
                          <div className="font-medium text-gray-800">PEA NO : {job.meterId}</div>
                          {job.meterSize && <div className="text-[10px] text-gray-500 mt-0.5">{job.meterSize}</div>}
                        </td>
                        <td className="px-3 py-2 align-middle whitespace-nowrap"><div className="font-medium text-gray-800">{job.ca || job.caNo}</div></td>
                        <td className="px-3 py-2 align-middle font-medium text-gray-800 max-w-[160px] truncate" title={job.userName || '-'}>{job.userName || '-'}</td>
                        <td className="px-3 py-2 align-middle font-medium text-gray-800 max-w-[160px] truncate" title={job.cause}>{job.cause}</td>
                        <td className="px-3 py-2 align-middle text-center">
                          {job.image ? (() => {
                            const imgs = (typeof job.image === 'string' ? job.image.split('|||') : job.image).filter(Boolean);
                            return (
                              <div className="flex items-center justify-center py-1 mx-auto pointer-events-none">
                                <img src={getProcessedImageUrl(imgs[0])} alt="cover" className="w-[40px] h-[40px] shrink-0 object-cover rounded-lg border border-gray-200 shadow-sm bg-white" onError={(e) => { e.target.onerror = null; e.target.src = 'https://via.placeholder.com/50?text=No+Img'; }} />
                                {imgs.length > 1 && <span className="ml-1.5 text-[10px] font-bold text-gray-500 bg-gray-100 px-1.5 py-0.5 rounded-md shadow-sm">+{imgs.length - 1}</span>}
                              </div>
                            );
                          })() : <span className="text-[10px] text-gray-300 italic">-</span>}
                        </td>
                        <td className="px-3 py-2 align-middle text-center">
                          {(job.lat || job.lng) ? (
                            <div className="flex flex-col items-center justify-center gap-1 relative z-10">
                              <a href={`https://maps.google.com/?q=${job.lat},${job.lng}`} target="_blank" onClick={(e) => e.stopPropagation()} className="inline-flex p-1.5 bg-blue-50 text-blue-600 rounded-xl hover:bg-blue-100 transition shadow-sm border border-blue-100" title="เปิดใน Google Maps">
                                <Icon name="MapPin" className="w-4 h-4" />
                              </a>
                              <span className="text-[9px] text-gray-500 max-w-[110px] truncate" title={`${job.lat}, ${job.lng}`}>{job.lat}, {job.lng}</span>
                             </div>
                          ) : <span className="text-[10px] text-gray-300 italic">-</span>}
                        </td>
                        <td className="px-3 py-2 align-middle text-center">
                            <div className="relative inline-block w-full min-w-[125px] max-w-[150px] z-10">
                                <select 
                                  onClick={(e) => e.stopPropagation()} 
                                  value={statusStr} 
                                  onChange={(e) => { 
                                    e.stopPropagation();
                                    handleStatusDropdownChange(job.id, e.target.value); 
                                  }} 
                                  disabled={isStatusDisabled} 
                                  className={`w-full text-[11px] font-black px-2 py-2 rounded-xl border-none outline-none transition-all appearance-none text-center ${statusConfig.color} ${isStatusDisabled ? 'cursor-not-allowed opacity-80' : 'cursor-pointer'}`}
                                >
                                    {tableStatuses.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                                {!isStatusDisabled && ( <Icon name="ChevronDown" className="w-3 h-3 absolute right-2 top-1/2 -translate-y-1/2 pointer-events-none opacity-50" /> )}
                            </div>
                        </td>
                        <td className="px-3 py-2 align-middle text-center">
                          {canUserPrint(currentUser) ? ( <div className="flex items-center justify-center gap-1 relative z-10"><button onClick={(e) => { e.stopPropagation(); openPrintPage(job.id, job.meterId); }} className="p-2 bg-emerald-50 text-emerald-600 rounded-full hover:bg-emerald-100 transition shadow-sm border border-emerald-100" title="พิมพ์แบบฟอร์ม PDF"><Icon name="Printer" className="w-4 h-4" /></button></div> ) : <span className="text-[10px] text-gray-300 italic">-</span>}
                        </td>
                      </tr>
                    )}) : <tr><td colSpan="10" className="p-20 text-center text-gray-400 font-medium italic">ไม่พบข้อมูลที่ตรงกับเงื่อนไข</td></tr>}
                  </tbody>
                  </table>
                </div>
              </div>
            </div>

            {selectedImage && selectedImage.length > 0 && ReactDOM.createPortal(
               <div 
                className="fixed inset-0 z-[9999] flex items-center justify-center bg-black/95 backdrop-blur-md animate-fade-in select-none" 
                onClick={() => {setSelectedImage(null); setCurrentImgIdx(0);}}
                onTouchStart={(e) => { touchStartX.current = e.targetTouches[0].clientX; touchEndX.current = e.targetTouches[0].clientX; }}
                onTouchMove={(e) => { touchEndX.current = e.targetTouches[0].clientX; }}
                onTouchEnd={() => {
                  const distance = touchStartX.current - touchEndX.current;
                  const minSwipeDistance = 50; 
                  if (distance > minSwipeDistance) setCurrentImgIdx(prev => prev === selectedImage.length - 1 ? 0 : prev + 1);
                  else if (distance < -minSwipeDistance) setCurrentImgIdx(prev => prev === 0 ? selectedImage.length - 1 : prev - 1);
                  touchStartX.current = 0; touchEndX.current = 0;
                }}
              >
                <div className="relative w-full h-full flex items-center justify-center" onClick={e => e.stopPropagation()}>
                  <img src={getProcessedImageUrl(selectedImage[currentImgIdx])} alt="Evidence" className="max-h-screen max-w-full object-contain mx-auto pointer-events-none" />
                  
                  {selectedImage.length > 1 && (
                    <>
                      <button onClick={(e) => { e.stopPropagation(); setCurrentImgIdx(prev => prev === 0 ? selectedImage.length - 1 : prev - 1); }} className="absolute left-4 sm:left-10 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white p-3 rounded-full transition shadow-lg z-50">
                        <svg className="w-6 h-6 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M15 19l-7-7 7-7"></path></svg>
                      </button>
                      
                      <button onClick={(e) => { e.stopPropagation(); setCurrentImgIdx(prev => prev === selectedImage.length - 1 ? 0 : prev + 1); }} className="absolute right-4 sm:right-10 top-1/2 -translate-y-1/2 bg-black/50 hover:bg-black/80 text-white p-3 rounded-full transition shadow-lg z-50">
                        <svg className="w-6 h-6 sm:w-8 sm:h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M9 5l7 7-7 7"></path></svg>
                      </button>
                      
                      <div className="absolute bottom-8 bg-black/60 text-white px-5 py-2 rounded-full text-sm font-bold tracking-widest z-50">
                        {currentImgIdx + 1} / {selectedImage.length}
                      </div>
                    </>
                  )}
                  
                  <button onClick={() => {setSelectedImage(null); setCurrentImgIdx(0);}} className="absolute top-4 right-4 sm:top-6 sm:right-6 bg-black/40 hover:bg-black/70 text-white p-2 sm:p-3 rounded-full transition z-50">
                    <Icon name="X" className="w-6 h-6 sm:w-8 sm:h-8" />
                  </button>
                </div>
              </div>, document.body
            )}
            {editingJob && <JobCompletionModal job={editingJob} onClose={() => setEditingJob(null)} onConfirm={handleCompletionConfirm} onDelete={onDeleteJob} mode={canUserEditCoreData(currentUser, editingJob.status) ? 'edit' : 'view'} currentUser={currentUser} />}
            
            {/* 💡 Pop-up Modal สำหรับแนบรูปปิดงาน (TECO) บนหน้า Dashboard */}
            {tecoModalJob && ReactDOM.createPortal(
               <div className="fixed inset-0 z-[10000] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in" onClick={() => { if(!isSubmittingTECO) { setTecoModalJob(null); setAuditImages([]); } }}>
                 <div className="bg-white rounded-[2rem] shadow-2xl max-w-lg w-full overflow-hidden flex flex-col animate-fade-in-up border border-emerald-100" onClick={e => e.stopPropagation()}>
                   {/* Header */}
                   <div className="bg-gradient-to-r from-emerald-500 to-emerald-600 p-5 sm:p-6 text-white flex justify-between items-center shadow-md relative z-10">
                     <div>
                       <h2 className="text-xl sm:text-2xl font-black flex items-center gap-2 tracking-tight">
                         <Icon name="CheckCircle" className="w-6 h-6 sm:w-7 sm:h-7 text-emerald-100" /> ปิดงาน (TECO)
                       </h2>
                       <p className="text-emerald-100 text-xs mt-1 font-medium">แนบไฟล์เพื่อยืนยันการปิดงาน</p>
                     </div>
                     <button disabled={isSubmittingTECO} onClick={() => { setTecoModalJob(null); setAuditImages([]); }} className="p-2 hover:bg-white/20 rounded-full transition disabled:opacity-50">
                       <Icon name="X" className="w-6 h-6" />
                     </button>
                   </div>
                   {/* Body */}
                   <div className="p-6 sm:p-8 space-y-6 bg-emerald-50/30">
                     <div className="bg-white p-4 rounded-2xl shadow-sm border border-emerald-100 flex justify-between items-center">
                       <div className="flex flex-col">
                         <span className="text-gray-400 text-[10px] font-bold uppercase tracking-widest">เลขที่ใบงานอ้างอิง</span>
                         <span className="text-xl font-black text-gray-800">{tecoModalJob.jobNo || tecoModalJob.id || '-'}</span>
                       </div>
                       <div className="bg-emerald-100 text-emerald-700 px-3 py-1.5 rounded-lg text-[10px] font-black uppercase tracking-wider">รอปิดงาน</div>
                     </div>
                     <div className="bg-white p-5 sm:p-6 rounded-2xl border border-emerald-200 shadow-sm space-y-4">
                       <div>
                         <label className="text-[15px] font-black text-emerald-800 flex items-center gap-2">
                           <Icon name="Camera" className="w-5 h-5 text-emerald-600" /> แนบหลักฐานเอกสาร/ภาพถ่าย *
                         </label>
                         <p className="text-[11px] text-emerald-600/70 font-bold mt-1">ต้องแนบอย่างน้อย 1 ไฟล์ (สูงสุด 5 ไฟล์)</p>
                       </div>
                       <div className="flex flex-wrap gap-3">
                         {auditImages.map((img, imgIdx) => (
                           <div key={imgIdx} className="relative w-20 h-20 sm:w-24 sm:h-24 rounded-xl overflow-hidden border border-emerald-200 bg-black flex justify-center group shrink-0">
                             {img.includes('application/pdf') ? (
                               <div className="w-full h-full bg-white flex flex-col items-center justify-center">
                                   <Icon name="FileText" className="w-8 h-8 text-emerald-500" />
                                   <span className="text-[9px] font-bold text-gray-500 mt-1">PDF</span>
                               </div>
                             ) : (
                               <img src={img} alt="Audit Preview" className="h-full object-cover w-full" />
                             )}
                             {!isSubmittingTECO && (
                               <button type="button" onClick={() => setAuditImages(auditImages.filter((_, i) => i !== imgIdx))} className="absolute top-1.5 right-1.5 bg-red-500 text-white p-1 rounded-full shadow-lg opacity-100 transition active:scale-95">
                                 <Icon name="X" className="w-3 h-3" />
                               </button> 
                             )}
                           </div>
                         ))}
                         {auditImages.length < 5 && !isSubmittingTECO && (
                           <label className="border-2 border-dashed border-emerald-300 bg-emerald-50/50 hover:bg-emerald-100 cursor-pointer rounded-xl flex flex-col items-center justify-center transition w-20 h-20 sm:w-24 sm:h-24 shrink-0">
                             <input type="file" multiple accept="image/*,application/pdf" onChange={(e) => {
                               const files = Array.from(e.target.files);
                               if (auditImages.length + files.length > 5) { alert("แนบเอกสารปิดงานได้สูงสุด 5 ไฟล์"); return; }
                               files.forEach(file => {
                                 const reader = new FileReader();
                                 reader.onloadend = () => setAuditImages(prev => [...prev, reader.result]);
                                 reader.readAsDataURL(file);
                               });
                             }} className="hidden" />
                             <Icon name="Camera" className="w-6 h-6 text-emerald-500 mb-1" />
                             <span className="text-[10px] font-bold text-emerald-600">เพิ่มไฟล์</span>
                           </label>
                         )}
                       </div>
                     </div>
                   </div>
                   {/* Footer */}
                   <div className="p-5 bg-white border-t border-emerald-100 flex gap-3 justify-end items-center">
                     <button disabled={isSubmittingTECO} onClick={() => { setTecoModalJob(null); setAuditImages([]); }} className="px-5 py-3 rounded-xl font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 transition text-sm disabled:opacity-50">ยกเลิก</button>
                     <button onClick={handleCloseJobTECO} disabled={isSubmittingTECO} className="px-6 py-3 rounded-xl font-black text-white bg-emerald-500 hover:bg-emerald-600 shadow-lg shadow-emerald-200 transition-all flex items-center gap-2 active:scale-95 disabled:opacity-70 text-sm sm:text-base">
                       {isSubmittingTECO ? <Icon name="Loader" className="w-5 h-5 animate-spin" /> : <Icon name="Check" className="w-5 h-5" />}
                       {isSubmittingTECO ? 'กำลังบันทึก...' : 'บันทึกปิดงาน'}
                     </button>
                   </div>
                 </div>
               </div>, 
               document.body
            )}
          </div>
        );
      };

      const AdminDashboard = UserDashboard;

      // ==========================================
      // 💡 แถว KPI การ์ดสรุป (บนสุดของหน้า Dashboard)
      // ==========================================
      const DashboardKPIs = ({ jobs }) => {
        const k = useMemo(() => {
          const safe = Array.isArray(jobs) ? jobs : [];
          const isClosed = (s) => { const x = getSafeStatus(s); return x === 'ปิดงาน (TECO)' || x === 'ยกเลิก'; };
          const open = safe.filter(j => !isClosed(j.status));
          const overdue = open.filter(j => Number(j.agingDays) > 7);
          const teco = safe.filter(j => getSafeStatus(j.status) === 'ปิดงาน (TECO)');
          let totalDays = 0, cnt = 0;
          teco.forEach(j => { const m = String(j.duration || '').match(/(\d+)\s*วัน/); if (m) { totalDays += Number(m[1]); cnt++; } });
          const avgDays = cnt ? Math.round(totalDays / cnt) : 0;
          const weekAgo = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000);
          const twoWeekAgo = new Date(Date.now() - 14 * 24 * 60 * 60 * 1000);
          const newWeek = safe.filter(j => { const d = parseDate(j.timestamp); return d && d >= weekAgo; });
          const prevWeek = safe.filter(j => { const d = parseDate(j.timestamp); return d && d >= twoWeekAgo && d < weekAgo; });
          const diff = newWeek.length - prevWeek.length;
          return { open: open.length, overdue: overdue.length, teco: teco.length, avgDays: avgDays, newWeek: newWeek.length, diff: diff };
        }, [jobs]);

        const cards = [
          { title: 'งานค้างทั้งหมด', value: k.open, icon: 'FileText', text: 'text-[#5F259F]', bg: 'bg-white', border: 'border-purple-100', iconBg: 'bg-purple-50', iconColor: 'text-purple-600' },
          { title: 'ค้างเกิน 7 วัน', value: k.overdue, icon: 'Alert', text: 'text-red-600', bg: 'bg-red-50', border: 'border-red-200', iconBg: 'bg-white', iconColor: 'text-red-500' },
          { title: 'ปิดงาน (TECO)', value: k.teco, icon: 'CheckCircle', text: 'text-emerald-600', bg: 'bg-white', border: 'border-emerald-100', iconBg: 'bg-emerald-50', iconColor: 'text-emerald-500' },
          { title: 'เวลาเฉลี่ยปิดงาน', value: k.avgDays, unit: 'วัน', icon: 'Clock', text: 'text-[#5F259F]', bg: 'bg-white', border: 'border-purple-100', iconBg: 'bg-purple-50', iconColor: 'text-purple-600' },
          { title: 'งานใหม่สัปดาห์นี้', value: k.newWeek, diff: k.diff, icon: 'PlusCircle', text: 'text-amber-600', bg: 'bg-white', border: 'border-amber-100', iconBg: 'bg-amber-50', iconColor: 'text-amber-500' },
        ];

        return (
          <div className="grid grid-cols-5 gap-1.5 sm:gap-4 mb-6 animate-fade-in">
            {cards.map((c, i) => (
              <div key={i} className={`${c.bg} border ${c.border} rounded-2xl shadow-sm px-3 py-3 sm:px-4 sm:py-4 flex flex-col justify-between`}>
                <div className="flex justify-between items-start mb-1">
                  <p className={`text-[10px] sm:text-xs font-bold uppercase tracking-wide leading-tight ${c.text}`}>{c.title}</p>
                  <div className={`${c.iconBg} p-1 rounded-lg shrink-0 hidden sm:block`}><Icon name={c.icon} className={`w-3.5 h-3.5 ${c.iconColor}`} /></div>
                </div>
                <h3 className={`text-xl sm:text-3xl font-black leading-none ${c.text}`}>{c.value}{c.unit && <span className="text-xs sm:text-sm font-bold ml-1.5 opacity-60">{c.unit}</span>}</h3>
                {c.diff !== undefined && c.diff !== 0 && <span className={`inline-flex items-center gap-1 text-[10px] sm:text-xs font-bold mt-1.5 ${c.diff > 0 ? 'text-green-500' : 'text-red-500'}`}>{c.diff > 0 ? '▲' : '▼'} {c.diff > 0 ? '+' : ''}{c.diff}</span>}
              </div>
            ))}
          </div>
        );
      };

      // ==========================================
      // 💡 งานค้างแยกตามอายุ (Aging) + แนวโน้มงานเข้า/ปิด (Trend)
      // ==========================================
      const AgingAndTrend = ({ jobs }) => {
        const aging = useMemo(() => {
          const safe = Array.isArray(jobs) ? jobs : [];
          const isClosed = (s) => { const x = getSafeStatus(s); return x === 'ปิดงาน (TECO)' || x === 'ยกเลิก'; };
          const open = safe.filter(j => !isClosed(j.status));
          const b = { a: 0, b: 0, c: 0, d: 0 };
          open.forEach(j => { const d = Number(j.agingDays) || 0; if (d <= 3) b.a++; else if (d <= 7) b.b++; else if (d <= 14) b.c++; else b.d++; });
          const max = Math.max(b.a, b.b, b.c, b.d, 1);
          return [
            { label: '0–3 วัน', val: b.a, pct: (b.a / max) * 100, color: 'bg-green-500', text: 'text-gray-600' },
            { label: '4–7 วัน', val: b.b, pct: (b.b / max) * 100, color: 'bg-amber-500', text: 'text-gray-600' },
            { label: '8–14 วัน', val: b.c, pct: (b.c / max) * 100, color: 'bg-orange-500', text: 'text-gray-600' },
            { label: '15+ วัน (เร่งด่วน)', val: b.d, pct: (b.d / max) * 100, color: 'bg-red-500', text: 'text-red-600' },
          ];
        }, [jobs]);

        const monthly = useMemo(() => {
          const safe = Array.isArray(jobs) ? jobs : [];
          const TH = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
          const months = [];
          const now = new Date();
          for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ y: d.getFullYear(), m: d.getMonth(), label: TH[d.getMonth()] }); }
          const counts = months.map(() => 0);
          safe.forEach(j => { const d = parseDate(j.timestamp); if (d) months.forEach((mo, i) => { if (d.getFullYear() === mo.y && d.getMonth() === mo.m) counts[i]++; }); });
          const max = Math.max(...counts, 1);
          const peakIdx = counts.indexOf(Math.max(...counts));
          return { bars: months.map((mo, i) => ({ label: mo.label, val: counts[i], h: (counts[i] / max) * 112, isPeak: i === peakIdx && counts[i] > 0 })), max };
        }, [jobs]);

        return (
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 mb-6 animate-fade-in">
            {/* งานค้างแยกตามอายุ */}
            <div className="bg-white p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-purple-50/50">
              <h3 className="text-lg sm:text-xl font-black text-[#5F259F] tracking-tight mb-5">งานค้างแยกตามระยะเวลา</h3>
              <div className="flex flex-col gap-4">
                {aging.map((a, i) => (
                  <div key={i}>
                    <div className="flex justify-between text-[13px] mb-1.5"><span className={`font-medium ${a.text}`}>{a.label}</span><span className={`font-black ${a.text}`}>{a.val}</span></div>
                    <div className="h-2.5 bg-gray-100 rounded-full overflow-hidden"><div className={`h-full ${a.color} rounded-full transition-all duration-500`} style={{ width: `${a.pct}%` }}></div></div>
                  </div>
                ))}
              </div>
            </div>

            {/* งานแจ้งซ่อมรายเดือน */}
            <div className="bg-white p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-purple-50/50">
              <h3 className="text-lg sm:text-xl font-black text-[#5F259F] tracking-tight mb-5">งานแจ้งซ่อมรายเดือน</h3>
              <svg viewBox="0 0 360 165" className="w-full h-auto">
                <line x1="28" y1="10" x2="28" y2="138" stroke="#E5E7EB" strokeWidth="1" />
                <line x1="28" y1="138" x2="356" y2="138" stroke="#E5E7EB" strokeWidth="1" />
                {monthly.bars.map((b, i) => {
                  const x = 34 + i * 27;
                  return (
                    <g key={i}>
                      <rect x={x} y={138 - b.h} width="18" height={b.h} rx="3" fill={b.isPeak ? '#534AB7' : '#7F77DD'} />
                      {b.val > 0 && <text x={x + 9} y={138 - b.h - 3} fontSize="7" fill="#6B7280" textAnchor="middle" fontWeight="bold">{b.val}</text>}
                      <text x={x + 9} y="150" fontSize="7" fill="#9CA3AF" textAnchor="middle">{b.label}</text>
                    </g>
                  );
                })}
              </svg>
            </div>
          </div>
        );
      };

      // ==========================================
      // 💡 คอขวดแต่ละสถานะ (Pipeline) + เหตุผลชำรุด
      // ==========================================
      const PipelineAndReason = ({ jobs }) => {
        const pipeline = useMemo(() => {
          const safe = Array.isArray(jobs) ? jobs : [];
          const flow = ['งานใหม่', 'รับเรื่อง', 'อนุมัติแล้ว', 'จ่ายงานแล้ว', 'สับเปลี่ยน SAP แล้ว'];
          const colors = { 'งานใหม่': 'bg-gray-400', 'รับเรื่อง': 'bg-blue-500', 'อนุมัติแล้ว': 'bg-[#5F259F]', 'จ่ายงานแล้ว': 'bg-amber-500', 'สับเปลี่ยน SAP แล้ว': 'bg-teal-500' };
          const counts = flow.map(s => safe.filter(j => getSafeStatus(j.status) === s).length);
          const max = Math.max(...counts, 1);
          const peakIdx = counts.indexOf(Math.max(...counts));
          return { rows: flow.map((s, i) => ({ label: s, val: counts[i], pct: (counts[i] / max) * 100, color: colors[s] })), peak: flow[peakIdx], peakVal: counts[peakIdx] };
        }, [jobs]);

        const reason = useMemo(() => {
          const safe = Array.isArray(jobs) ? jobs : [];
          const map = { 'ธรรมชาติ': 0, 'มนุษย์': 0, 'โจรกรรม': 0, 'อื่นๆ': 0 };
          safe.forEach(j => { const r = String(j.defectReason || '').trim(); if (map[r] !== undefined) map[r]++; else if (r) map['อื่นๆ']++; });
          const total = Object.values(map).reduce((a, b) => a + b, 0) || 1;
          const colors = { 'ธรรมชาติ': '#5F259F', 'มนุษย์': '#F59E0B', 'โจรกรรม': '#EF4444', 'อื่นๆ': '#9CA3AF' };
          let offset = 0;
          const segs = Object.entries(map).filter(([k, v]) => v > 0).map(([k, v]) => { const pct = (v / total) * 100; const seg = { label: k, val: v, pct: Math.round(pct), color: colors[k], dash: `${pct * 2.39} ${239 - pct * 2.39}`, offset: -offset * 2.39 }; offset += pct; return seg; });
          return { segs, total };
        }, [jobs]);

        return (
          <div className="grid grid-cols-1 lg:grid-cols-2 gap-4 sm:gap-6 mb-6 animate-fade-in">
            {/* คอขวดแต่ละสถานะ */}
            <div className="bg-white p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-purple-50/50">
              <h3 className="text-lg sm:text-xl font-black text-[#5F259F] tracking-tight mb-5">คอขวด — งานค้างแต่ละขั้น</h3>
              <div className="flex flex-col gap-3">
                {pipeline.rows.map((r, i) => (
                  <div key={i} className="flex items-center gap-3">
                    <span className="w-24 sm:w-28 text-[12px] sm:text-[13px] text-gray-600 font-medium shrink-0 truncate">{r.label}</span>
                    <div className="flex-1 h-5 bg-gray-100 rounded-lg overflow-hidden"><div className={`h-full ${r.color} rounded-lg transition-all duration-500`} style={{ width: `${r.pct}%` }}></div></div>
                    <span className="w-6 text-right text-[13px] font-black text-gray-700 shrink-0">{r.val}</span>
                  </div>
                ))}
              </div>
              {pipeline.peakVal > 0 && (
                <div className="mt-4 px-3 py-2.5 bg-purple-50 rounded-xl text-[12px] sm:text-[13px] text-[#5F259F] font-medium flex items-center gap-2">
                  <Icon name="Alert" className="w-4 h-4 shrink-0" /> งานกระจุกที่ "{pipeline.peak}" {pipeline.peakVal} ใบ
                </div>
              )}
            </div>

            {/* เหตุผลชำรุด */}
            <div className="bg-white p-6 rounded-[2rem] shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-purple-50/50">
              <h3 className="text-lg sm:text-xl font-black text-[#5F259F] tracking-tight mb-5">เหตุผลชำรุด</h3>
              <div className="flex items-center gap-6">
                <svg viewBox="0 0 100 100" className="w-28 h-28 sm:w-32 sm:h-32 shrink-0">
                  {reason.segs.map((s, i) => (
                    <circle key={i} cx="50" cy="50" r="38" fill="none" stroke={s.color} strokeWidth="20" strokeDasharray={s.dash} strokeDashoffset={s.offset} transform="rotate(-90 50 50)" />
                  ))}
                </svg>
                <div className="flex flex-col gap-2.5 text-[13px]">
                  {reason.segs.length > 0 ? reason.segs.map((s, i) => (
                    <span key={i} className="flex items-center gap-2"><span className="w-3 h-3 rounded-sm shrink-0" style={{ backgroundColor: s.color }}></span><span className="text-gray-600">{s.label}</span><b className="font-black text-gray-800">{s.pct}%</b></span>
                  )) : <span className="text-gray-400 italic">ยังไม่มีข้อมูล</span>}
                </div>
              </div>
            </div>
          </div>
        );
      };

      // ==========================================
      // 💡 1. คอมโพเนนต์หน้า กราฟสรุปสถิติ
      // ==========================================
      const AnalyticsDashboard = ({ jobs }) => {
        const stats = useMemo(() => {
          const safeJobs = Array.isArray(jobs) ? jobs : [];
          return {
            total: safeJobs.length,
            new: safeJobs.filter(j => getSafeStatus(j.status) === 'งานใหม่').length,
            received: safeJobs.filter(j => getSafeStatus(j.status) === 'รับเรื่อง').length,
            proposed: safeJobs.filter(j => getSafeStatus(j.status) === 'อนุมัติแล้ว').length,
            assigned: safeJobs.filter(j => getSafeStatus(j.status) === 'จ่ายงานแล้ว').length,
            sap: safeJobs.filter(j => getSafeStatus(j.status) === 'สับเปลี่ยน SAP แล้ว').length,
            teco: safeJobs.filter(j => getSafeStatus(j.status) === 'ปิดงาน (TECO)').length,
            cancelled: safeJobs.filter(j => getSafeStatus(j.status) === 'ยกเลิก').length,
          };
        }, [jobs]);

        return (
          <div className="w-full pb-4 animate-fade-in h-full mt-2">
             <DashboardKPIs jobs={jobs} />
             <AgingAndTrend jobs={jobs} />
             <PipelineAndReason jobs={jobs} />
             <JobMap jobs={jobs} />
          </div>
        );
      };

      // ==========================================
      // 💡 2. คอมโพเนนต์หน้า ประวัติ
      // ==========================================
      const HistoryDashboard = () => {
        const [logs, setLogs] = useState([]);
        const [loading, setLoading] = useState(true);

        useEffect(() => {
          if (typeof google !== 'undefined' && google.script) {
            google.script.run.withSuccessHandler(data => {
              setLogs(data); setLoading(false);
            }).getLogs();
          } else { setLoading(false); }
        }, []);
        
        return (
          <div className="w-full h-full flex flex-col pb-2 animate-fade-in">
            <div className="mb-4 shrink-0"><h2 className="text-xl sm:text-3xl font-black text-[#5F259F] tracking-tight uppercase">ประวัติการทำรายการ (System Logs)</h2></div>
            <div className="bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden relative flex-grow flex flex-col min-h-0">
              {loading ? ( <div className="h-64 flex flex-col items-center justify-center"><Icon name="Loader" className="w-8 h-8 animate-spin text-[#5F259F]" /></div> ) : (
                 <React.Fragment>
                 <div className="hidden sm:block overflow-x-auto">
                   <div className="min-w-[900px]">
                     <table className="w-full text-left border-collapse table-fixed">
                       <colgroup><col style={{width:'180px'}}/><col style={{width:'150px'}}/><col style={{width:'120px'}}/><col style={{width:'180px'}}/><col style={{width:'190px'}}/><col/></colgroup>
                       <thead className="bg-[#F3E8FF] border-b border-purple-200">
                         <tr><th className="px-4 py-4 text-sm font-bold text-black uppercase">วันเวลา</th><th className="px-4 py-4 text-sm font-bold text-black uppercase">การทำรายการ</th><th className="px-4 py-4 text-sm font-bold text-black uppercase">เลขงาน</th><th className="px-4 py-4 text-sm font-bold text-black uppercase">สถานะ</th><th className="px-4 py-4 text-sm font-bold text-black uppercase">ผู้ทำรายการ</th><th className="px-4 py-4"></th></tr>
                       </thead>
                     </table>
                     <div className="flex-grow overflow-y-auto" style={{maxHeight: 'calc(100vh - 260px)'}}>
                       <table className="w-full text-left border-collapse table-fixed">
                         <colgroup><col style={{width:'180px'}}/><col style={{width:'150px'}}/><col style={{width:'120px'}}/><col style={{width:'180px'}}/><col style={{width:'190px'}}/><col/></colgroup>
                         <tbody className="divide-y divide-gray-50">
                           {logs.length > 0 ? logs.map((log, idx) => ( <tr key={idx} className="hover:bg-purple-50 transition-colors text-sm"><td className="px-4 py-3 whitespace-nowrap text-gray-600">{log.timestamp}</td><td className="px-4 py-3 whitespace-nowrap font-bold text-[#5F259F]">{log.action}</td><td className="px-4 py-3 whitespace-nowrap font-mono text-purple-700">{log.jobNo}</td><td className="px-4 py-3 whitespace-nowrap text-gray-700">{log.status}</td><td className="px-4 py-3 whitespace-nowrap text-gray-600">{log.user}</td><td></td></tr> )) : <tr><td colSpan="6" className="p-10 text-center text-gray-400">ไม่มีข้อมูลประวัติ</td></tr>}
                         </tbody>
                       </table>
                     </div>
                   </div>
                 </div>
                 <div className="sm:hidden flex-grow overflow-y-auto divide-y divide-gray-100 min-h-0">
                   {logs.length > 0 ? logs.map((log, idx) => (
                     <div key={idx} className="p-4 active:bg-purple-50">
                       <div className="flex items-center justify-between mb-1.5">
                         <span className="font-bold text-[#5F259F] text-sm">{log.action}</span>
                         <span className="font-mono text-purple-700 text-sm font-semibold">{log.jobNo}</span>
                       </div>
                       <div className="flex items-center justify-between mb-1"><div className="text-xs text-gray-500">{log.timestamp}</div>{log.user ? <div className="text-xs text-gray-500"><span className="text-gray-400">โดย </span>{log.user}</div> : null}</div>
                       {log.status ? <div className="text-sm text-gray-800"><span className="text-gray-400">สถานะ: </span>{log.status}</div> : null}
                     </div>
                   )) : <div className="p-10 text-center text-gray-400">ไม่มีข้อมูลประวัติ</div>}
                 </div>
                 </React.Fragment>
              )}
            </div>
          </div>
        );
      };

      // ==========================================
      // 💡 ฟอร์ม popup เพิ่ม/แก้ผู้ใช้งาน
      // ==========================================
      const ALL_ROLES = [
        { code: 'Admin', label: 'ผู้ดูแลระบบ' },
        { code: 'Coordinator', label: 'ผู้ประสานงาน' },
        { code: 'Approver', label: 'ผู้อนุมัติ' },
        { code: 'Inventory', label: 'พัสดุ/คลัง' },
        { code: 'SAP', label: 'เจ้าหน้าที่ SAP' },
        { code: 'Audit', label: 'ตรวจสอบ/ปิดงาน' },
        { code: 'Employee', label: 'พนักงานทั่วไป' },
      ];

      const UserFormModal = ({ user, onClose, onSaved, existingUsernames }) => {
        const isEdit = !!user;
        const [username, setUsername] = useState(user ? user.username : '');
        const [password, setPassword] = useState('');
        const [fullName, setFullName] = useState(user ? (user.full_name || '') : '');
        const [isActive, setIsActive] = useState(user ? user.is_active !== false : true);
        const [showPassword, setShowPassword] = useState(false);
        const [saving, setSaving] = useState(false);
        const [err, setErr] = useState('');
        // แปลง roles (label string) กลับเป็น code
        const [selectedRoles, setSelectedRoles] = useState(() => {
          if (!user || !user.roles) return [];
          const labels = String(user.roles).split(',').map(s => s.trim());
          return ALL_ROLES.filter(r => labels.includes(r.label) || labels.includes(r.code)).map(r => r.code);
        });

        const toggleRole = (code) => {
          setSelectedRoles(prev => prev.includes(code) ? prev.filter(c => c !== code) : [...prev, code]);
        };

        const handleSave = () => {
          setErr('');
          if (!username.trim()) { setErr('กรุณากรอก Username'); return; }
          if (!isEdit && existingUsernames.includes(username.trim())) { setErr('มี Username นี้อยู่แล้ว'); return; }
          if (!isEdit && !password.trim()) { setErr('กรุณากรอกรหัสผ่าน'); return; }
          if (!fullName.trim()) { setErr('กรุณากรอกชื่อ-สกุล'); return; }
          if (selectedRoles.length === 0) { setErr('กรุณาเลือกสิทธิ์อย่างน้อย 1 รายการ'); return; }

          setSaving(true);
          const fail = (e) => { setSaving(false); setErr('เกิดข้อผิดพลาด: ' + (e.message || e)); };
          const done = (res) => {
            setSaving(false);
            if (res && res.success === false) { setErr(res.message || 'บันทึกไม่สำเร็จ'); return; }
            onSaved();
          };
          if (typeof google !== 'undefined' && google.script) {
            if (isEdit) {
              google.script.run.withSuccessHandler(done).withFailureHandler(fail).adminUpdateUser(username.trim(), password.trim(), fullName.trim(), isActive, selectedRoles);
            } else {
              google.script.run.withSuccessHandler(done).withFailureHandler(fail).adminCreateUser(username.trim(), password.trim(), fullName.trim(), isActive, selectedRoles);
            }
          } else { setSaving(false); }
        };

        return ReactDOM.createPortal(
          <div className="fixed inset-0 z-[10000] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
            <div className="bg-white rounded-[2rem] shadow-2xl max-w-md w-full overflow-hidden flex flex-col animate-fade-in-up max-h-[92vh]" onClick={e => e.stopPropagation()}>
              <div className="bg-[#5F259F] p-5 text-white flex justify-between items-center shrink-0">
                <h2 className="text-lg font-black flex items-center gap-2"><Icon name={isEdit ? 'Edit' : 'PlusCircle'} className="w-5 h-5" /> {isEdit ? 'แก้ไขผู้ใช้งาน' : 'เพิ่มผู้ใช้งานใหม่'}</h2>
                <button disabled={saving} onClick={onClose} className="p-1.5 hover:bg-white/20 rounded-full transition disabled:opacity-50"><Icon name="X" className="w-5 h-5" /></button>
              </div>
              <div className="p-6 space-y-4 overflow-y-auto">
                <div>
                  <label className="text-[12px] font-bold text-gray-500 uppercase tracking-wider mb-1 block">Username *</label>
                  <input type="text" value={username} disabled={isEdit} onChange={e => setUsername(e.target.value)} placeholder="ชื่อผู้ใช้สำหรับเข้าระบบ" className={`w-full p-2.5 border rounded-xl text-sm font-bold outline-none transition-all ${isEdit ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed' : 'bg-white border-purple-200 text-gray-800 focus:ring-2 focus:ring-[#5F259F]'}`} />
                  {isEdit && <p className="text-[10px] text-gray-400 mt-1 ml-1">Username ไม่สามารถแก้ไขได้</p>}
                </div>
                <div>
                  <label className="text-[12px] font-bold text-gray-500 uppercase tracking-wider mb-1 block">รหัสผ่าน {isEdit ? '(เว้นว่าง = ไม่เปลี่ยน)' : '*'}</label>
                  <div className="relative">
                    <input type={showPassword ? 'text' : 'password'} value={password} onChange={e => setPassword(e.target.value)} placeholder={isEdit ? 'กรอกเฉพาะถ้าต้องการเปลี่ยน' : 'กำหนดรหัสผ่าน'} className="w-full p-2.5 pr-11 bg-white border border-purple-200 rounded-xl text-sm font-bold text-gray-800 outline-none focus:ring-2 focus:ring-[#5F259F] transition-all" />
                    <button type="button" onClick={() => setShowPassword(!showPassword)} className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600"><Icon name={showPassword ? 'EyeOff' : 'Eye'} className="w-5 h-5" /></button>
                  </div>
                </div>
                <div>
                  <label className="text-[12px] font-bold text-gray-500 uppercase tracking-wider mb-1 block">ชื่อ-สกุล *</label>
                  <input type="text" value={fullName} onChange={e => setFullName(e.target.value)} placeholder="ชื่อ-นามสกุล" className="w-full p-2.5 bg-white border border-purple-200 rounded-xl text-sm font-bold text-gray-800 outline-none focus:ring-2 focus:ring-[#5F259F] transition-all" />
                </div>
                <div>
                  <label className="text-[12px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">สิทธิ์การใช้งาน * (เลือกได้หลายข้อ)</label>
                  <div className="grid grid-cols-2 gap-2">
                    {ALL_ROLES.map(r => (
                      <label key={r.code} className={`flex items-center gap-2 px-3 py-2 rounded-xl border cursor-pointer transition-all text-[13px] font-bold ${selectedRoles.includes(r.code) ? 'bg-purple-50 border-[#5F259F] text-[#5F259F]' : 'bg-white border-gray-200 text-gray-500 hover:border-purple-200'}`}>
                        <input type="checkbox" checked={selectedRoles.includes(r.code)} onChange={() => toggleRole(r.code)} className="custom-checkbox !w-4 !h-4" />
                        {r.label}
                      </label>
                    ))}
                  </div>
                </div>
                <div>
                  <label className="text-[12px] font-bold text-gray-500 uppercase tracking-wider mb-2 block">สถานะ</label>
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setIsActive(true)} className={`flex-1 py-2.5 rounded-xl text-sm font-bold border transition-all ${isActive ? 'bg-emerald-50 border-emerald-300 text-emerald-700' : 'bg-white border-gray-200 text-gray-400'}`}>ใช้งาน</button>
                    <button type="button" onClick={() => setIsActive(false)} className={`flex-1 py-2.5 rounded-xl text-sm font-bold border transition-all ${!isActive ? 'bg-gray-200 border-gray-400 text-gray-700' : 'bg-white border-gray-200 text-gray-400'}`}>ปิดใช้งาน</button>
                  </div>
                </div>
                {err && <div className="p-3 bg-red-50 text-red-600 text-[13px] font-bold rounded-xl border border-red-100 text-center">{err}</div>}
              </div>
              <div className="p-4 border-t border-gray-100 flex gap-3 justify-end shrink-0">
                <button disabled={saving} onClick={onClose} className="px-5 py-2.5 rounded-xl font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 transition text-sm disabled:opacity-50">ยกเลิก</button>
                <button onClick={handleSave} disabled={saving} className="px-6 py-2.5 rounded-xl font-black text-white bg-[#5F259F] hover:bg-[#4a1d7c] shadow-lg shadow-purple-200 transition flex items-center gap-2 active:scale-95 disabled:opacity-60 text-sm">{saving ? <Icon name="Loader" className="w-4 h-4 animate-spin" /> : <Icon name="Check" className="w-4 h-4" />} {saving ? 'กำลังบันทึก...' : 'บันทึก'}</button>
              </div>
            </div>
          </div>, document.body
        );
      };

      // ==========================================
      // 💡 popup แก้เลขที่/วันที่ใบงาน (Admin)
      // ==========================================
      const JobEditModal = ({ job, currentUser, onClose, onSaved }) => {
        const [jobNo, setJobNo] = useState(job.jobNo || '');
        const [timestamp, setTimestamp] = useState('');
        const [saving, setSaving] = useState(false);
        const [err, setErr] = useState('');

        useEffect(() => {
          const d = parseDate(job.timestamp);
          if (d && !isNaN(d.getTime())) {
            const pad = n => String(n).padStart(2, '0');
            setTimestamp(`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`);
          }
        }, [job]);

        const handleSave = () => {
          setErr('');
          if (!jobNo.trim()) { setErr('กรุณากรอกเลขที่ใบงาน'); return; }
          if (!timestamp) { setErr('กรุณาเลือกวันที่-เวลา'); return; }
          setSaving(true);
          const payload = { jobNo: jobNo.trim(), timestamp: new Date(timestamp).toISOString() };
          const done = (res) => {
            setSaving(false);
            if (res && res.success === false) { setErr(res.message || 'บันทึกไม่สำเร็จ'); return; }
            onSaved();
          };
          const fail = (e) => { setSaving(false); setErr('เกิดข้อผิดพลาด: ' + (e.message || e)); };
          if (typeof google !== 'undefined' && google.script) {
            google.script.run.withSuccessHandler(done).withFailureHandler(fail).updateJobDetails(job.id, payload, currentUser?.name);
          } else { setSaving(false); }
        };

        return ReactDOM.createPortal(
          <div className="fixed inset-0 z-[10000] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
            <div className="bg-white rounded-[2rem] shadow-2xl max-w-md w-full overflow-hidden flex flex-col animate-fade-in-up" onClick={e => e.stopPropagation()}>
              <div className="bg-[#5F259F] p-5 text-white flex justify-between items-center shrink-0">
                <h2 className="text-lg font-black flex items-center gap-2"><Icon name="Edit" className="w-5 h-5" /> แก้ไขใบงาน</h2>
                <button disabled={saving} onClick={onClose} className="p-1.5 hover:bg-white/20 rounded-full transition disabled:opacity-50"><Icon name="X" className="w-5 h-5" /></button>
              </div>
              <div className="p-6 space-y-4">
                <div className="bg-purple-50 rounded-xl p-3 border border-purple-100 text-[13px]">
                  <div className="flex justify-between mb-1"><span className="text-gray-500 font-bold">PEA:</span><span className="font-bold text-gray-800">{job.meterId || '-'}</span></div>
                  <div className="flex justify-between"><span className="text-gray-500 font-bold">ลูกค้า:</span><span className="font-bold text-gray-800 truncate ml-2">{job.userName || '-'}</span></div>
                </div>
                <div>
                  <label className="text-[12px] font-bold text-gray-500 uppercase tracking-wider mb-1 block">เลขที่ใบงาน *</label>
                  <input type="text" value={jobNo} onChange={e => setJobNo(e.target.value)} placeholder="เลขที่ใบงาน" className="w-full p-2.5 bg-white border border-purple-200 rounded-xl text-sm font-bold text-gray-800 outline-none focus:ring-2 focus:ring-[#5F259F] transition-all" />
                </div>
                <div>
                  <label className="text-[12px] font-bold text-gray-500 uppercase tracking-wider mb-1 block">วันที่ - เวลาแจ้ง *</label>
                  <input type="datetime-local" value={timestamp} onChange={e => setTimestamp(e.target.value)} className="w-full p-2.5 bg-white border border-purple-200 rounded-xl text-sm font-bold text-gray-800 outline-none focus:ring-2 focus:ring-[#5F259F] transition-all" />
                </div>
                <div className="bg-amber-50 border border-amber-200 rounded-xl px-3 py-2 text-[11px] text-amber-700 font-medium flex items-start gap-1.5">
                  <Icon name="Alert" className="w-3.5 h-3.5 shrink-0 mt-0.5" /> เลขที่ใบงานต้องไม่ซ้ำกับใบงานอื่นในระบบ
                </div>
                {err && <div className="p-3 bg-red-50 text-red-600 text-[13px] font-bold rounded-xl border border-red-100 text-center">{err}</div>}
              </div>
              <div className="p-4 border-t border-gray-100 flex gap-3 justify-end shrink-0">
                <button disabled={saving} onClick={onClose} className="px-5 py-2.5 rounded-xl font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 transition text-sm disabled:opacity-50">ยกเลิก</button>
                <button onClick={handleSave} disabled={saving} className="px-6 py-2.5 rounded-xl font-black text-white bg-[#5F259F] hover:bg-[#4a1d7c] shadow-lg shadow-purple-200 transition flex items-center gap-2 active:scale-95 disabled:opacity-60 text-sm">{saving ? <Icon name="Loader" className="w-4 h-4 animate-spin" /> : <Icon name="Check" className="w-4 h-4" />} {saving ? 'กำลังบันทึก...' : 'บันทึก'}</button>
              </div>
            </div>
          </div>, document.body
        );
      };

      // ==========================================
      // 💡 popup แก้ชื่อสิทธิ์ (label)
      // ==========================================
      const RoleEditModal = ({ role, onClose, onSaved }) => {
        const [label, setLabel] = useState(role.label || '');
        const [saving, setSaving] = useState(false);
        const [err, setErr] = useState('');

        const handleSave = () => {
          setErr('');
          if (!label.trim()) { setErr('กรุณากรอกชื่อสิทธิ์'); return; }
          setSaving(true);
          const done = (res) => { setSaving(false); if (res && res.success === false) { setErr(res.message || 'บันทึกไม่สำเร็จ'); return; } onSaved(); };
          const fail = (e) => { setSaving(false); setErr('เกิดข้อผิดพลาด: ' + (e.message || e)); };
          if (typeof google !== 'undefined' && google.script) {
            google.script.run.withSuccessHandler(done).withFailureHandler(fail).adminUpdateRole(role.code, label.trim());
          } else { setSaving(false); }
        };

        return ReactDOM.createPortal(
          <div className="fixed inset-0 z-[10000] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm animate-fade-in">
            <div className="bg-white rounded-[2rem] shadow-2xl max-w-sm w-full overflow-hidden flex flex-col animate-fade-in-up" onClick={e => e.stopPropagation()}>
              <div className="bg-[#5F259F] p-5 text-white flex justify-between items-center shrink-0">
                <h2 className="text-lg font-black flex items-center gap-2"><Icon name="Edit" className="w-5 h-5" /> แก้ไขชื่อสิทธิ์</h2>
                <button disabled={saving} onClick={onClose} className="p-1.5 hover:bg-white/20 rounded-full transition disabled:opacity-50"><Icon name="X" className="w-5 h-5" /></button>
              </div>
              <div className="p-6 space-y-4">
                <div>
                  <label className="text-[12px] font-bold text-gray-500 uppercase tracking-wider mb-1 block">Code (แก้ไม่ได้)</label>
                  <input type="text" value={role.code} disabled className="w-full p-2.5 bg-gray-100 border border-gray-200 rounded-xl text-sm font-mono font-bold text-gray-400 cursor-not-allowed" />
                  <p className="text-[10px] text-gray-400 mt-1 ml-1">Code ใช้ในระบบสิทธิ์ ไม่สามารถแก้ไขได้</p>
                </div>
                <div>
                  <label className="text-[12px] font-bold text-gray-500 uppercase tracking-wider mb-1 block">ชื่อสิทธิ์ (ภาษาไทย) *</label>
                  <input type="text" value={label} onChange={e => setLabel(e.target.value)} placeholder="ชื่อที่แสดงในระบบ" className="w-full p-2.5 bg-white border border-purple-200 rounded-xl text-sm font-bold text-gray-800 outline-none focus:ring-2 focus:ring-[#5F259F] transition-all" />
                </div>
                {err && <div className="p-3 bg-red-50 text-red-600 text-[13px] font-bold rounded-xl border border-red-100 text-center">{err}</div>}
              </div>
              <div className="p-4 border-t border-gray-100 flex gap-3 justify-end shrink-0">
                <button disabled={saving} onClick={onClose} className="px-5 py-2.5 rounded-xl font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 transition text-sm disabled:opacity-50">ยกเลิก</button>
                <button onClick={handleSave} disabled={saving} className="px-6 py-2.5 rounded-xl font-black text-white bg-[#5F259F] hover:bg-[#4a1d7c] shadow-lg shadow-purple-200 transition flex items-center gap-2 active:scale-95 disabled:opacity-60 text-sm">{saving ? <Icon name="Loader" className="w-4 h-4 animate-spin" /> : <Icon name="Check" className="w-4 h-4" />} {saving ? 'กำลังบันทึก...' : 'บันทึก'}</button>
              </div>
            </div>
          </div>, document.body
        );
      };

      // ==========================================
      // 📥 ระบบนำเข้าไฟล์ (Import) — ลูกค้า / มิเตอร์
      // ==========================================
      const IMPORT_CONFIG = {
        customers: {
          label: 'ลูกค้าผู้ใช้ไฟ', keyField: 'pea_id', keyLabel: 'หมายเลข PEA', rpc: 'import_customers', renumberRpc: 'renumber_customers',
          fields: [
            { db:'mru', label:'หน่วยการอ่านมิเตอร์', aliases:['หน่วยการอ่านมิเตอร์','mru'] },
            { db:'sequence_no', label:'เลขลำดับจดหน่วย', aliases:['เลขลำดับจดหน่วย'] },
            { db:'pea_id', label:'หมายเลข PEA', aliases:['หมายเลข pea','pea','pea มิเตอร์'] },
            { db:'ca_id', label:'หมายเลขผู้ใช้ไฟฟ้า (CA)', aliases:['หมายเลขผู้ใช้ไฟฟ้า','ca'] },
            { db:'rate_category', label:'หมวดอัตรา', aliases:['หมวดอัตรา'] },
            { db:'name', label:'ชื่อ-นามสกุล', aliases:['ชื่อ-นามสกุล','ชื่อ-สกุล','ชื่อผู้ใช้ไฟฟ้า'] },
            { db:'address', label:'ที่อยู่-สถานที่ใช้ไฟฟ้า', aliases:['ที่อยู่-สถานที่ใช้ไฟฟ้า','ที่อยู่'] },
            { db:'install_no', label:'หมายเลขการติดตั้ง', aliases:['หมายเลขการติดตั้ง'] },
            { db:'premise_no', label:'หมายเลขสถานที่ใช้ไฟฟ้า', aliases:['หมายเลขสถานที่ใช้ไฟฟ้า'] },
            { db:'device_location', label:'สถานที่ติดตั้งอุปกรณ์', aliases:['สถานที่ติดตั้งอุปกรณ์'] },
            { db:'install_type_code', label:'รหัสประเภทการติดตั้ง', aliases:['รหัสประเภทการติดตั้ง'] },
            { db:'install_type', label:'ประเภทการติดตั้ง', aliases:['ประเภทการติดตั้ง'] },
            { db:'meter_type', label:'ประเภทมิเตอร์', aliases:['ประเภทมิเตอร์'] },
            { db:'remark', label:'หมายเหตุ', aliases:['หมายเหตุ'] },
          ]
        },
        meters: {
          label: 'ข้อมูลมิเตอร์', keyField: 'ca_id', keyLabel: 'บัญชีแสดงสัญญา (CA)', rpc: 'import_meters', renumberRpc: 'renumber_meters', stripZero: ['ca_id'],
          fields: [
            { db:'mru', label:'สายการจดหน่วย', aliases:['สายการจดหน่วย','หน่วยการอ่านมิเตอร์','mru'] },
            { db:'sequence_no', label:'การเพิ่มที่ตั้ง', aliases:['การเพิ่มที่ตั้ง'] },
            { db:'bp_no', label:'คู่ค้าทางธุรกิจ', aliases:['คู่ค้าทางธุรกิจ','bp'] },
            { db:'customer_name', label:'ชื่อผู้ใช้ไฟฟ้า', aliases:['ชื่อผู้ใช้ไฟฟ้า'] },
            { db:'ca_id', label:'บัญชีแสดงสัญญา', aliases:['บัญชีแสดงสัญญา','ca'] },
            { db:'account_class', label:'คลาสบัญชี', aliases:['คลาสบัญชี'] },
            { db:'install_no', label:'การติดตั้ง', aliases:['การติดตั้ง'] },
            { db:'rate_category', label:'อัตราตั้งต้น', aliases:['อัตราตั้งต้น'] },
            { db:'billing_rate', label:'อัตราคิดเงิน', aliases:['อัตราคิดเงิน'] },
            { db:'tsic_code', label:'TSIC', aliases:['tsic'] },
            { db:'tsic_desc', label:'คำอธิบาย TSIC', aliases:['คำอธิบาย tsic'] },
            { db:'meter_model', label:'Meter Type', aliases:['meter type'] },
            { db:'meter_size', label:'Meter Size', aliases:['meter size'] },
            { db:'meter_size_desc', label:'คำอธิบาย Meter Size', aliases:['คำอธิบาย meter size'] },
            { db:'device_category_desc', label:'คำอธิบายหมวดอุปกรณ์', aliases:['คำอธิบายหมวดอุปกรณ์'] },
          ]
        }
      };
      const normHeader = (s) => String(s == null ? '' : s).trim().toLowerCase().replace(/\s+/g, ' ');

      const ImportModal = ({ tableType, existingData, onClose, onDone }) => {
        const cfg = IMPORT_CONFIG[tableType];
        const [step, setStep] = useState(1);
        const [fileName, setFileName] = useState('');
        const [headers, setHeaders] = useState([]);
        const [rawRows, setRawRows] = useState([]);
        const [mapping, setMapping] = useState({}); // db field -> file column index (or -1)
        const [preview, setPreview] = useState({ added:0, updated:0, skipped:0, valid:[] });
        const [progress, setProgress] = useState(0);
        const [busy, setBusy] = useState(false);
        const [reading, setReading] = useState(false);
        const [errMsg, setErrMsg] = useState('');

        const handleFile = async (file) => {
          if (!file) return;
          setErrMsg(''); setFileName(file.name); setReading(true);
          // หน่วงสั้นๆ ให้ตัวหมุนแสดงก่อนเริ่มแกะไฟล์ (กันหน้าจอค้าง)
          await new Promise(r => setTimeout(r, 40));
          try {
            const buf = new Uint8Array(await file.arrayBuffer());
            const wb = XLSX.read(buf, { type: 'array', dense: true, cellDates: false, cellNF: false, cellText: false });
            const ws = wb.Sheets[wb.SheetNames[0]];
            const aoa = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: true, blankrows: false });
            if (!aoa || aoa.length < 2) { setErrMsg('ไฟล์ว่างหรืออ่านไม่ได้'); setReading(false); return; }
            const hdr = aoa[0].map(h => String(h == null ? '' : h));
            const body = aoa.slice(1).filter(r => r.some(c => String(c == null ? '' : c).trim() !== ''));
            // auto map
            const autoMap = {};
            cfg.fields.forEach(f => {
              let found = -1;
              hdr.forEach((h, idx) => {
                if (found >= 0) return;
                const nh = normHeader(h);
                if (nh && f.aliases.some(a => normHeader(a) === nh)) found = idx;
              });
              autoMap[f.db] = found;
            });
            setHeaders(hdr); setRawRows(body); setMapping(autoMap); setReading(false); setStep(2);
          } catch (e) { setErrMsg('อ่านไฟล์ไม่สำเร็จ: ' + e); setReading(false); }
        };

        const buildPreview = () => {
          const keyIdx = mapping[cfg.keyField];
          if (keyIdx == null || keyIdx < 0) { setErrMsg('กรุณาจับคู่คอลัมน์ "' + cfg.keyLabel + '" (คีย์เช็คซ้ำ) ก่อน'); return; }
          setErrMsg('');
          const keySet = new Set((existingData || []).map(d => String(d[cfg.keyField] == null ? '' : d[cfg.keyField]).trim()).filter(Boolean));
          let added=0, updated=0, skipped=0; const valid=[];
          rawRows.forEach(r => {
            const obj = {};
            cfg.fields.forEach(f => { const idx = mapping[f.db]; let v = (idx != null && idx >= 0) ? String(r[idx] == null ? '' : r[idx]).trim() : ''; if (cfg.stripZero && cfg.stripZero.includes(f.db)) v = v.replace(/^0+/, ''); obj[f.db] = v; });
            const keyVal = String(obj[cfg.keyField] || '').trim();
            if (!keyVal) { skipped++; return; }
            if (keySet.has(keyVal)) updated++; else added++;
            valid.push(obj);
          });
          setPreview({ added, updated, skipped, valid });
          setStep(3);
        };

        const commit = async () => {
          setBusy(true); setStep(4); setProgress(0);
          const rows = preview.valid; const batchSize = 1000;
          let totAdded = 0, totUpdated = 0;
          try {
            for (let i = 0; i < rows.length; i += batchSize) {
              const batch = rows.slice(i, i + batchSize);
              const { data, error } = await sb.rpc(cfg.rpc, { p_rows: batch });
              if (error) throw error;
              if (data) { totAdded += (data.added || 0); totUpdated += (data.updated || 0); }
              setProgress(Math.round(Math.min(100, ((i + batch.length) / rows.length) * 100)));
            }
            if (cfg.renumberRpc) { try { await sb.rpc(cfg.renumberRpc); } catch(e){} }
            setBusy(false);
            onDone({ added: totAdded, updated: totUpdated, skipped: preview.skipped });
          } catch (e) {
            setBusy(false); setErrMsg('บันทึกไม่สำเร็จ: ' + (e.message || e)); setStep(3);
          }
        };

        const stepTitle = { 1:'เลือกไฟล์', 2:'จับคู่คอลัมน์', 3:'ตรวจสอบก่อนบันทึก', 4:'กำลังบันทึก' };

        return ReactDOM.createPortal(
          <div className="fixed inset-0 z-[10000] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={busy ? undefined : onClose}>
            <div className="bg-white rounded-[2rem] shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-hidden flex flex-col" onClick={e => e.stopPropagation()}>
              <div className="bg-[#5F259F] p-5 text-white flex justify-between items-center shrink-0">
                <h2 className="text-lg font-black">นำเข้า{cfg.label} · ขั้นที่ {step} · {stepTitle[step]}</h2>
                {!busy && <button onClick={onClose} className="p-1.5 hover:bg-white/20 rounded-full transition"><Icon name="X" className="w-5 h-5" /></button>}
              </div>

              <div className="p-6 overflow-y-auto flex-grow">
                {errMsg && <div className="mb-4 bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-2.5 text-sm font-bold">{errMsg}</div>}

                {step === 1 && (
                  reading ? (
                    <div className="border-2 border-dashed border-purple-300 rounded-2xl p-10 flex flex-col items-center justify-center bg-purple-50/40">
                      <Icon name="Loader" className="w-9 h-9 animate-spin text-[#5F259F] mb-3" />
                      <span className="text-[15px] font-bold text-gray-700">กำลังอ่านไฟล์ {fileName}...</span>
                      <span className="text-[12px] text-gray-400 mt-1">ไฟล์ใหญ่อาจใช้เวลาสักครู่ อย่าปิดหน้าต่าง</span>
                    </div>
                  ) : (
                    <label onDragOver={e => { e.preventDefault(); }} onDrop={e => { e.preventDefault(); if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); }} className="border-2 border-dashed border-purple-300 rounded-2xl p-10 flex flex-col items-center justify-center bg-purple-50/40 hover:bg-purple-50 transition cursor-pointer">
                      <input type="file" accept=".csv,.xlsx,.xls" className="hidden" onChange={e => handleFile(e.target.files[0])} />
                      <div className="bg-white p-4 rounded-full shadow-sm mb-3"><Icon name="ArrowRight" className="w-7 h-7 text-[#5F259F] -rotate-90" /></div>
                      <span className="text-[15px] font-bold text-gray-700">คลิกเลือก หรือ ลากไฟล์มาวางที่นี่</span>
                      <span className="text-[12px] text-gray-400 mt-1">รองรับ .csv, .xlsx, .xls · แนะนำ .xlsx กันภาษาไทยเพี้ยน</span>
                    </label>
                  )
                )}

                {step === 2 && (
                  <div>
                    <div className="text-[13px] font-bold text-[#5F259F] mb-3">📄 {fileName} · พบ {rawRows.length.toLocaleString()} แถว</div>
                    <table className="w-full text-sm">
                      <thead><tr className="text-[11px] text-gray-500 uppercase"><th className="text-left pb-2">คอลัมน์ในฐานข้อมูล</th><th></th><th className="text-left pb-2">คอลัมน์ในไฟล์</th></tr></thead>
                      <tbody>
                        {cfg.fields.map(f => (
                          <tr key={f.db} className="border-b border-gray-50">
                            <td className="py-1.5 font-bold text-gray-700">{f.label} {f.db === cfg.keyField && <span className="ml-1 bg-amber-100 text-amber-700 text-[10px] font-bold px-1.5 py-0.5 rounded">คีย์เช็คซ้ำ</span>}</td>
                            <td className="px-2 text-center">{mapping[f.db] != null && mapping[f.db] >= 0 ? <Icon name="Check" className="w-4 h-4 text-green-500 inline" /> : <Icon name="X" className="w-4 h-4 text-red-500 inline" />}</td>
                            <td className="py-1.5">
                              <select value={mapping[f.db]} onChange={e => setMapping(prev => ({ ...prev, [f.db]: parseInt(e.target.value, 10) }))} className="border border-gray-200 rounded-lg px-2 py-1.5 text-sm bg-purple-50/40 font-semibold text-gray-700 w-full">
                                <option value={-1}>— ไม่มีในไฟล์ —</option>
                                {headers.map((h, idx) => <option key={idx} value={idx}>{h || `(คอลัมน์ ${idx+1})`}</option>)}
                              </select>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}

                {step === 3 && (
                  <div>
                    <div className="grid grid-cols-3 gap-3 mb-4">
                      <div className="bg-emerald-50 rounded-2xl p-4 text-center"><div className="text-3xl font-black text-emerald-600">{preview.added.toLocaleString()}</div><div className="text-xs font-bold text-emerald-600 mt-1">เพิ่มใหม่</div></div>
                      <div className="bg-blue-50 rounded-2xl p-4 text-center"><div className="text-3xl font-black text-blue-600">{preview.updated.toLocaleString()}</div><div className="text-xs font-bold text-blue-600 mt-1">ทับของเดิม</div></div>
                      <div className="bg-red-50 rounded-2xl p-4 text-center"><div className="text-3xl font-black text-red-600">{preview.skipped.toLocaleString()}</div><div className="text-xs font-bold text-red-600 mt-1">ข้าม (คีย์ว่าง)</div></div>
                    </div>
                    <div className="bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-[13px] text-amber-700 font-medium">
                      พร้อมบันทึก {preview.valid.length.toLocaleString()} แถว · {preview.skipped > 0 ? `ข้าม ${preview.skipped.toLocaleString()} แถวที่ ${cfg.keyLabel} ว่าง` : 'ไม่มีแถวที่ต้องข้าม'}
                    </div>
                  </div>
                )}

                {step === 4 && (
                  <div className="text-center py-8">
                    <div className="text-[15px] font-bold text-gray-700 mb-3">กำลังบันทึกลงฐานข้อมูล... {progress}%</div>
                    <div className="bg-gray-100 rounded-full h-3 overflow-hidden"><div className="h-full transition-all duration-200" style={{ width: progress + '%', backgroundColor: progress < 40 ? '#F97316' : progress < 75 ? '#EAB308' : '#22C55E' }}></div></div>
                    <div className="text-[12px] text-gray-400 mt-3">บันทึกทีละ 1,000 แถว · อย่าปิดหน้าต่างนี้</div>
                  </div>
                )}
              </div>

              {step < 4 && (
                <div className="p-4 border-t border-gray-100 flex justify-between shrink-0">
                  <button onClick={step === 1 ? onClose : () => { setErrMsg(''); setStep(step - 1); }} className="px-5 py-2.5 rounded-xl font-bold text-gray-500 bg-gray-100 hover:bg-gray-200 transition text-sm">{step === 1 ? 'ยกเลิก' : 'ย้อนกลับ'}</button>
                  {step === 2 && <button onClick={buildPreview} className="px-5 py-2.5 rounded-xl font-bold text-white bg-[#5F259F] hover:bg-[#4a1d7c] transition text-sm">ถัดไป · ตรวจสอบ</button>}
                  {step === 3 && <button onClick={commit} className="px-5 py-2.5 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-700 transition text-sm">ยืนยัน บันทึก {preview.valid.length.toLocaleString()} แถว</button>}
                </div>
              )}
            </div>
          </div>, document.body
        );
      };

      // ==========================================
      // 🚀 Cache ฝั่ง client ลดการดึงข้อมูลซ้ำจาก Supabase (ลด Egress)
      // เก็บใน sessionStorage อายุ 12 ชม. — ข้อมูลลูกค้า/มิเตอร์เปลี่ยนไม่บ่อย
      // ==========================================
      const CACHE_TTL_MS = 12 * 60 * 60 * 1000;
      const readCache = (key) => {
        try {
          const raw = sessionStorage.getItem('cache_' + key);
          if (!raw) return null;
          const obj = JSON.parse(raw);
          if (!obj || !obj.t || (Date.now() - obj.t) > CACHE_TTL_MS) return null;
          return Array.isArray(obj.d) ? obj.d : null;
        } catch (e) { return null; }
      };
      const writeCache = (key, data) => {
        try { sessionStorage.setItem('cache_' + key, JSON.stringify({ t: Date.now(), d: data })); } catch (e) {}
      };
      const clearCache = (key) => { try { sessionStorage.removeItem('cache_' + key); } catch (e) {} };

      // ==========================================
      // 💡 หน้าจัดการฐานข้อมูล (Admin เท่านั้น)
      // ==========================================
      const DatabaseManager = ({ currentUser }) => {
        const TABLES = [
          { id: 'jobs', label: 'ใบงานแจ้งซ่อม', icon: 'FileText' },
          { id: 'users', label: 'ผู้ใช้งาน', icon: 'User' },
          { id: 'roles', label: 'สิทธิ์ (Roles)', icon: 'Lock' },
          { id: 'customers', label: 'ลูกค้าผู้ใช้ไฟ', icon: 'Search' },
          { id: 'meters', label: 'ข้อมูลมิเตอร์', icon: 'Zap' },
          { id: 'history', label: 'ประวัติการทำรายการ', icon: 'History' },
        ];
        const [activeTable, setActiveTable] = useState('jobs');
        const [search, setSearch] = useState('');
        const current = TABLES.find(t => t.id === activeTable);

        const [users, setUsers] = useState([]);
        const [loadingUsers, setLoadingUsers] = useState(false);
        const [jobsData, setJobsData] = useState([]);
        const [loadingJobs, setLoadingJobs] = useState(false);
        const [editJob, setEditJob] = useState(null);

        useEffect(() => {
          if (activeTable === 'users') {
            setLoadingUsers(true);
            if (typeof google !== 'undefined' && google.script) {
              google.script.run.withSuccessHandler(data => { setUsers(Array.isArray(data) ? data : []); setLoadingUsers(false); }).withFailureHandler(() => { setLoadingUsers(false); }).adminListUsers();
            } else { setLoadingUsers(false); }
          }
          if (activeTable === 'jobs') {
            setLoadingJobs(true);
            if (typeof google !== 'undefined' && google.script) {
              google.script.run.withSuccessHandler(data => { setJobsData(Array.isArray(data) ? data : []); setLoadingJobs(false); }).withFailureHandler(() => { setLoadingJobs(false); }).getAdminJobs();
              google.script.run.withSuccessHandler(data => { setUsers(Array.isArray(data) ? data : []); }).adminListUsers();
            } else { setLoadingJobs(false); }
          }
        }, [activeTable]);

        const filteredJobs = useMemo(() => {
          const term = search.toLowerCase();
          return jobsData.filter(j => String(j.jobNo || '').toLowerCase().includes(term) || String(j.meterId || '').toLowerCase().includes(term) || String(j.userName || '').toLowerCase().includes(term) || String(j.ca || j.caNo || '').toLowerCase().includes(term)).sort((a, b) => Number(b.jobNo) - Number(a.jobNo));
        }, [jobsData, search]);

        const [rolesData, setRolesData] = useState([]);
        const [loadingRoles, setLoadingRoles] = useState(false);
        const [editRole, setEditRole] = useState(null);

        // 🚀 Server-side pagination: เก็บเฉพาะแถวของหน้าที่กำลังดู (ไม่ดึงทั้งตารางมาไว้ในเบราว์เซอร์)
        const [custData, setCustData] = useState([]);      // แถวเฉพาะหน้าปัจจุบัน
        const [custTotal, setCustTotal] = useState(0);      // จำนวนรวมจาก server
        const [loadingCust, setLoadingCust] = useState(false);
        const [custPage, setCustPage] = useState(1);
        const custPerPage = 500;

        const loadCustomers = (page = 1, term = '') => {
          setLoadingCust(true);
          if (typeof google !== 'undefined' && google.script) {
            google.script.run
              .withSuccessHandler(res => {
                setCustData(Array.isArray(res && res.rows) ? res.rows : []);
                setCustTotal(Number((res && res.total) || 0));
                setLoadingCust(false);
              })
              .withFailureHandler(() => { setCustData([]); setCustTotal(0); setLoadingCust(false); })
              .adminListCustomers(custPerPage, (page - 1) * custPerPage, term);
          } else { setLoadingCust(false); }
        };

        const custItems = custData;
        const custTotalPages = Math.ceil(custTotal / custPerPage);
        const [showImport, setShowImport] = useState(false);
        // 🚀 คีย์สำหรับเช็คซ้ำตอน Import — ดึงเฉพาะคอลัมน์คีย์ (เบากว่าดึงทั้งตาราง)
        const [importKeys, setImportKeys] = useState([]);
        const openImport = () => {
          setImportKeys([]);
          if (typeof google !== 'undefined' && google.script) {
            google.script.run
              .withSuccessHandler(data => setImportKeys(Array.isArray(data) ? data : []))
              .withFailureHandler(() => setImportKeys([]))
              .adminListKeys(activeTable);
          }
          setShowImport(true);
        };

        const [meterData, setMeterData] = useState([]);
        const [meterTotal, setMeterTotal] = useState(0);
        const [loadingMeter, setLoadingMeter] = useState(false);
        const [meterPage, setMeterPage] = useState(1);
        const meterPerPage = 500;

        const loadMeters = (page = 1, term = '') => {
          setLoadingMeter(true);
          if (typeof google !== 'undefined' && google.script) {
            google.script.run
              .withSuccessHandler(res => {
                setMeterData(Array.isArray(res && res.rows) ? res.rows : []);
                setMeterTotal(Number((res && res.total) || 0));
                setLoadingMeter(false);
              })
              .withFailureHandler(() => { setMeterData([]); setMeterTotal(0); setLoadingMeter(false); })
              .adminListMeters(meterPerPage, (page - 1) * meterPerPage, term);
          } else { setLoadingMeter(false); }
        };

        const meterItems = meterData;
        const meterTotalPages = Math.ceil(meterTotal / meterPerPage);

        // เปลี่ยนคำค้น -> กลับหน้า 1 (หน่วง 400ms กันยิง server ทุกตัวอักษร)
        useEffect(() => { setCustPage(1); setMeterPage(1); }, [search]);

        // โหลดข้อมูลเมื่อ: เข้าแท็บ / เปลี่ยนหน้า / เปลี่ยนคำค้น (debounce)
        useEffect(() => {
          if (activeTable !== 'customers') return;
